# HOST-RESOURCES-MIB (RFC 2790): storage and processor load.
name: host-resources-mib
tables:
  - name: hrStorageTable
    oid: 1.3.6.1.2.1.25.2.3.1
    label_col: "3"
    label_attr: hw.name
    items:
      - {col: "5", mul_col: "4", metric: snmp.storage.size, unit: By}
      - {col: "6", mul_col: "4", metric: snmp.storage.used, unit: By}
  - name: hrProcessorTable
    oid: 1.3.6.1.2.1.25.3.3.1
    items:
      - {col: "2", metric: snmp.processor.load, unit: "%"}
