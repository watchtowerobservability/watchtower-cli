# BGP4-MIB (RFC 4273) peer sessions (INF-019). The row index is the peer's IPv4 address, so
# every series carries it as bgp.peer.address. bgp.peer.state: 1 idle, 2 connect, 3 active,
# 4 opensent, 5 openconfirm, 6 established.
name: bgp4-mib
tables:
  - name: bgpPeerTable
    oid: 1.3.6.1.2.1.15.3.1
    priority: 2
    label_attr: bgp.peer.address
    items:
      - {col: "2", metric: bgp.peer.state}
      - {col: "3", metric: bgp.peer.admin_status}       # 1 stop, 2 start
      - {col: "9", metric: bgp.peer.remote_as}
      - {col: "10", metric: bgp.peer.updates.rate, unit: "{update}/s", kind: counter, attrs: {network.io.direction: receive}}
      - {col: "11", metric: bgp.peer.updates.rate, unit: "{update}/s", kind: counter, attrs: {network.io.direction: transmit}}
      - {col: "15", metric: bgp.peer.established_transitions.rate, unit: "{transition}/s", kind: counter}
      - {col: "16", metric: bgp.peer.established_time, unit: s}
      - {col: "24", metric: bgp.peer.update_elapsed_time, unit: s}
