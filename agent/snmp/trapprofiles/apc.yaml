# APC (Schneider Electric) PowerNet-MIB UPS traps. They are SNMPv1 traps with enterprise
# 1.3.6.1.4.1.318, so their RFC 3584 OID is enterprise.0.<specific>.
vendor: apc
traps:
  - {oid: 1.3.6.1.4.1.318.0.1, name: communicationLost, severity: ERROR}
  - {oid: 1.3.6.1.4.1.318.0.2, name: upsOverload, severity: ERROR}
  - {oid: 1.3.6.1.4.1.318.0.3, name: upsDiagnosticsFailed, severity: ERROR}
  - {oid: 1.3.6.1.4.1.318.0.4, name: upsDischarged, severity: ERROR}
  - {oid: 1.3.6.1.4.1.318.0.5, name: upsOnBattery, severity: WARN}
  - {oid: 1.3.6.1.4.1.318.0.6, name: smartBoostOn, severity: WARN}
  - {oid: 1.3.6.1.4.1.318.0.7, name: lowBattery, severity: ERROR}
  - {oid: 1.3.6.1.4.1.318.0.8, name: communicationEstablished, severity: INFO}
  - {oid: 1.3.6.1.4.1.318.0.9, name: powerRestored, severity: INFO}
