name: gitlab
version: "1.0.0"
discovery:
  process_names: ["puma", "gitlab-workhorse", "sidekiq"]
  ports: []
  k8s_labels: {"app.kubernetes.io/name": "gitlab"}
module:
  kind: gitlab
  config_defaults: {"url": "http://127.0.0.1", "interval": "30s"}
metrics:
  - {name: "gitlab_http_requests_total", unit: "{requests}", description: "Rails requests by method and status (cumulative)."}
  - {name: "gitlab_sidekiq_jobs_failed_total", unit: "{jobs}", description: "Sidekiq jobs that failed (cumulative)."}
  - {name: "gitlab_puma_queued_connections", unit: "{connections}", description: "Connections waiting for a Puma thread."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Requests/s", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"gitlab_http_requests_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Puma queue", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"gitlab_puma_queued_connections\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "gitlab unreachable"
    rule: {"name": "gitlab unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"gitlab\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "gitlab unreachable", "runbook_url": ""}}
    threshold_rationale: "The gitlab collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "gitlab puma saturated"
    rule: {"name": "gitlab puma saturated", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"gitlab_puma_queued_connections\"})"}, "condition": {"threshold": {"op": "gt", "value": 10}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "gitlab puma saturated", "runbook_url": "https://docs.watchtower.example/runbooks/gitlab-puma-saturated"}}
    threshold_rationale: "Requests queue for a Puma thread for 5 minutes: users see slow pages; add workers or threads."
    runbook_url: "https://docs.watchtower.example/runbooks/gitlab-puma-saturated"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/gitlab/gitlab-rails/production_json.log", "/var/log/gitlab/gitlab-rails/application_json.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_json", "target": "body", "when": "starts_with(body, \"{\")"}, {"type": "remap", "set_severity": {"from": "severity", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
