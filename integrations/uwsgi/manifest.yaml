name: uwsgi
version: "1.0.0"
discovery:
  process_names: ["uwsgi"]
  ports: [9117]
  k8s_labels: {"app": "uwsgi"}
module:
  kind: uwsgi
  config_defaults: {"url": "http://127.0.0.1:9117", "interval": "30s"}
metrics:
  - {name: "uwsgi_up", unit: "1", description: "1 while the exporter reaches the uWSGI stats server."}
  - {name: "uwsgi_stats_listen_queue", unit: "{requests}", description: "Requests waiting in the listen queue."}
  - {name: "uwsgi_stats_listen_queue_errors", unit: "{errors}", description: "Listen queue overflows (cumulative)."}
  - {name: "uwsgi_worker_requests_total", unit: "{requests}", description: "Requests per worker (cumulative)."}
  - {name: "uwsgi_worker_exceptions_total", unit: "{exceptions}", description: "Exceptions per worker (cumulative)."}
  - {name: "uwsgi_worker_busy", unit: "1", description: "1 while the worker handles a request."}
  - {name: "uwsgi_worker_rss_bytes", unit: "By", description: "Resident memory per worker."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "1 while the exporter reaches the uWSGI stats server", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"uwsgi_up\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Requests waiting in the listen queue", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"uwsgi_stats_listen_queue\"})"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Listen queue overflows", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"uwsgi_stats_listen_queue_errors\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Requests per worker", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"uwsgi_worker_requests_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Exceptions per worker", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"uwsgi_worker_exceptions_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p5", "title": "1 while the worker handles a request", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"uwsgi_worker_busy\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "uwsgi unreachable"
    rule: {"name": "uwsgi unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"uwsgi\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "uwsgi unreachable", "runbook_url": ""}}
    threshold_rationale: "The uwsgi collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "uwsgi listen queue overflow"
    rule: {"name": "uwsgi listen queue overflow", "kind": "metric", "query": {"promql": "sum by (host_name) (increase({__name__=\"uwsgi_stats_listen_queue_errors\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 120, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "uwsgi listen queue overflow", "runbook_url": "https://docs.watchtower.example/runbooks/uwsgi-alert"}}
    threshold_rationale: "The kernel dropped connections because the listen queue is full."
    runbook_url: "https://docs.watchtower.example/runbooks/uwsgi-alert"
    default_enabled: true
  - name: "uwsgi workers all busy"
    rule: {"name": "uwsgi workers all busy", "kind": "metric", "query": {"promql": "min by (host_name) ({__name__=\"uwsgi_worker_busy\"})"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "uwsgi workers all busy", "runbook_url": "https://docs.watchtower.example/runbooks/uwsgi-alert"}}
    threshold_rationale: "Every worker busy for 5 minutes means requests wait for a free worker."
    runbook_url: "https://docs.watchtower.example/runbooks/uwsgi-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/uwsgi/uwsgi.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "\\[pid: %{NUMBER:pid}\\|app: %{DATA:app}\\|req: %{DATA:req}\\] %{IPORHOST:client} \\(%{DATA:user}\\) \\{%{DATA:vars}\\} \\[%{DATA:time}\\] %{WORD:method} %{NOTSPACE:path} => %{GREEDYDATA:message}", "on_fail": "keep"}]}}
