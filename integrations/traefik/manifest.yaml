name: traefik
version: "1.0.0"
discovery:
  process_names: ["traefik", "traefik.exe"]
  ports: [8080]
  k8s_labels: {"app.kubernetes.io/name": "traefik"}
module:
  kind: traefik
  config_defaults: {"url": "http://127.0.0.1:8080", "interval": "30s"}
metrics:
  - {name: "traefik_service_requests_total", unit: "{requests}", description: "Requests per service and status code (cumulative)."}
  - {name: "traefik_entrypoint_requests_total", unit: "{requests}", description: "Requests per entrypoint (cumulative)."}
  - {name: "traefik_service_server_up", unit: "1", description: "1 while a service's backend server passes its health check."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Requests/s by service", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name, service) (rate({__name__=\"traefik_service_requests_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Backends up", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "min by (host_name, service) ({__name__=\"traefik_service_server_up\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "traefik unreachable"
    rule: {"name": "traefik unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"traefik\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "traefik unreachable", "runbook_url": ""}}
    threshold_rationale: "The traefik collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "traefik backend down"
    rule: {"name": "traefik backend down", "kind": "metric", "query": {"promql": "min by (host_name, service, url) ({__name__=\"traefik_service_server_up\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 120, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "traefik backend down", "runbook_url": "https://docs.watchtower.example/runbooks/traefik-backend-down"}}
    threshold_rationale: "A backend failed Traefik's health check for 2 minutes and is out of rotation."
    runbook_url: "https://docs.watchtower.example/runbooks/traefik-backend-down"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/traefik/access.log", "/var/log/traefik/traefik.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_json", "target": "body", "when": "starts_with(body, \"{\")"}, {"type": "parse_grok", "target": "body", "pattern": "%{IPORHOST:client} %{USER:ident} %{USER:auth} \\[%{HTTPDATE:time}\\] \"%{WORD:method} %{NOTSPACE:path} %{NOTSPACE:protocol}\" %{NUMBER:status} (?:%{NUMBER:bytes}|-) %{QS:referrer} %{QS:user_agent} %{NUMBER:request_count} \"%{DATA:router}\" \"%{DATA:backend_url}\" %{NUMBER:duration_ms}ms", "on_fail": "keep"}, {"type": "remap", "rename": {"ClientHost": "client", "RequestMethod": "method", "RequestPath": "path", "DownstreamStatus": "status", "RouterName": "router"}}, {"type": "remap", "cast": {"status": "int"}}]}}
