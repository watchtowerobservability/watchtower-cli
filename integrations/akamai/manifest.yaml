name: akamai
version: "1.0.0"
discovery:
  process_names: []
  ports: []
  k8s_labels: {}
module:
  kind: akamai
  config_defaults: {"url": "http://127.0.0.1:9100", "interval": "30s", "token": "CHANGE_ME"}
metrics:
  - {name: "akamai_requests_total", unit: "{requests}", description: "Edge requests by property (cumulative)."}
  - {name: "akamai_edge_hits_total", unit: "{requests}", description: "Edge cache hits (cumulative)."}
  - {name: "akamai_origin_hits_total", unit: "{requests}", description: "Origin requests (cumulative)."}
  - {name: "akamai_bandwidth_bytes_total", unit: "By", description: "Bytes delivered (cumulative)."}
  - {name: "akamai_http_errors_total", unit: "{requests}", description: "4xx and 5xx responses by class (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Edge requests by property", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"akamai_requests_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Edge cache hits", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"akamai_edge_hits_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Origin requests", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"akamai_origin_hits_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Bytes delivered", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"akamai_bandwidth_bytes_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p4", "title": "4xx and 5xx responses by class", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"akamai_http_errors_total\"}[5m]))"}, "options": {"unit": "short"}}]}
alerts:
  - name: "akamai unreachable"
    rule: {"name": "akamai unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"akamai\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "akamai unreachable", "runbook_url": ""}}
    threshold_rationale: "The akamai collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "akamai 5xx rate"
    rule: {"name": "akamai 5xx rate", "kind": "metric", "query": {"promql": "sum by (host_name) (rate({__name__=\"akamai_http_errors_total\", class=\"5xx\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "akamai 5xx rate", "runbook_url": "https://docs.watchtower.example/runbooks/akamai-alert"}}
    threshold_rationale: "A sustained 5xx rate at the edge means the origin is failing behind the CDN."
    runbook_url: "https://docs.watchtower.example/runbooks/akamai-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["datastream://akamai"], "pipeline": {"version": 1, "stages": [{"type": "parse_json", "target": "body", "when": "starts_with(body, \"{\")"}, {"type": "parse_kv", "target": "body", "when": "contains(body, \"level=\")"}, {"type": "remap", "rename": {"msg": "message"}}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
