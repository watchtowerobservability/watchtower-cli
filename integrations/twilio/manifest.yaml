name: twilio
version: "1.0.0"
discovery:
  process_names: []
  ports: []
  k8s_labels: {}
module:
  kind: twilio
  config_defaults: {"url": "https://status.twilio.com/api/v2/summary.json", "interval": "120s"}
metrics:
  - {name: "twilio.indicator", unit: "1", description: "Twilio overall status: 0 none, 1 minor, 2 major, 3 critical."}
  - {name: "twilio.component.status", unit: "1", description: "Twilio component status: 0 operational, 1 degraded, 2 partial outage, 3 major outage, 4 maintenance."}
  - {name: "twilio.incidents.active", unit: "{incidents}", description: "Unresolved Twilio incidents."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Twilio overall status: 0 none, 1 minor, 2 major, 3 critical", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"twilio.indicator\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Twilio component status: 0 operational, 1 degraded, 2 partia", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"twilio.component.status\"})"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Unresolved Twilio incidents", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"twilio.incidents.active\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "twilio unreachable"
    rule: {"name": "twilio unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"twilio\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "twilio unreachable", "runbook_url": ""}}
    threshold_rationale: "The twilio collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "twilio incident"
    rule: {"name": "twilio incident", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"twilio.indicator\"})"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "twilio incident", "runbook_url": "https://docs.watchtower.example/runbooks/twilio-alert"}}
    threshold_rationale: "Twilio reports a degradation: failures against it may not be your code."
    runbook_url: "https://docs.watchtower.example/runbooks/twilio-alert"
    default_enabled: true
  - name: "twilio major outage"
    rule: {"name": "twilio major outage", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"twilio.indicator\"})"}, "condition": {"threshold": {"op": "gt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 120, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "twilio major outage", "runbook_url": "https://docs.watchtower.example/runbooks/twilio-alert"}}
    threshold_rationale: "Twilio reports a major or critical outage."
    runbook_url: "https://docs.watchtower.example/runbooks/twilio-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
