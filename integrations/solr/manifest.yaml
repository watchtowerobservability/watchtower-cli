name: solr
version: "1.0.0"
discovery:
  process_names: ["solr-exporter", "solr"]
  ports: [9854]
  k8s_labels: {"app.kubernetes.io/name": "solr"}
module:
  kind: solr
  config_defaults: {"url": "http://127.0.0.1:9854", "interval": "30s"}
metrics:
  - {name: "solr_metrics_core_requests_total", unit: "{requests}", description: "Requests per core and handler (cumulative)."}
  - {name: "solr_metrics_core_errors_total", unit: "{requests}", description: "Failed requests per core and handler (cumulative)."}
  - {name: "solr_collections_live_nodes", unit: "{nodes}", description: "Live nodes of the SolrCloud cluster."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Requests/s by core", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name, core) (rate({__name__=\"solr_metrics_core_requests_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Live nodes", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "min by (host_name) ({__name__=\"solr_collections_live_nodes\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "solr unreachable"
    rule: {"name": "solr unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"solr\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "solr unreachable", "runbook_url": ""}}
    threshold_rationale: "The solr collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/solr/logs/solr.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time} %{WORD:level} +\\(%{DATA:thread}\\) \\[%{DATA:core}\\] %{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
