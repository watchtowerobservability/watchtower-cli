name: karpenter
version: "1.0.0"
discovery:
  process_names: ["karpenter"]
  ports: []
  k8s_labels: {"app.kubernetes.io/name": "karpenter"}
module:
  kind: karpenter
  config_defaults: {"url": "http://127.0.0.1:8080", "interval": "30s"}
metrics:
  - {name: "karpenter_nodeclaims_created_total", unit: "{nodeclaims}", description: "Node claims created by reason and node pool (cumulative)."}
  - {name: "karpenter_nodeclaims_terminated_total", unit: "{nodeclaims}", description: "Node claims terminated (cumulative)."}
  - {name: "karpenter_nodepools_usage", unit: "1", description: "Resources in use per node pool."}
  - {name: "karpenter_nodepools_limit", unit: "1", description: "Resource limit per node pool."}
  - {name: "karpenter_cloudprovider_errors_total", unit: "{errors}", description: "Cloud provider API errors (cumulative)."}
  - {name: "karpenter_voluntary_disruption_decisions_total", unit: "{decisions}", description: "Consolidation, drift and expiry decisions (cumulative)."}
  - {name: "karpenter_interruption_received_messages_total", unit: "{messages}", description: "Spot interruption and health messages received (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Node claims created by reason and node pool", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"karpenter_nodeclaims_created_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Node claims terminated", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"karpenter_nodeclaims_terminated_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Resources in use per node pool", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"karpenter_nodepools_usage\"})"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Resource limit per node pool", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"karpenter_nodepools_limit\"})"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Cloud provider API errors", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"karpenter_cloudprovider_errors_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p5", "title": "Consolidation, drift and expiry decisions", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"karpenter_voluntary_disruption_decisions_total\"}[5m]))"}, "options": {"unit": "short"}}]}
alerts:
  - name: "karpenter unreachable"
    rule: {"name": "karpenter unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"karpenter\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "karpenter unreachable", "runbook_url": ""}}
    threshold_rationale: "The karpenter collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "karpenter cloud provider errors"
    rule: {"name": "karpenter cloud provider errors", "kind": "metric", "query": {"promql": "sum by (host_name) (increase({__name__=\"karpenter_cloudprovider_errors_total\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 5}}, "every_s": 60, "window_s": 300, "for_s": 600, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "karpenter cloud provider errors", "runbook_url": "https://docs.watchtower.example/runbooks/karpenter-alert"}}
    threshold_rationale: "Provisioning calls are failing: pending pods will not get nodes."
    runbook_url: "https://docs.watchtower.example/runbooks/karpenter-alert"
    default_enabled: true
  - name: "karpenter node pool near limit"
    rule: {"name": "karpenter node pool near limit", "kind": "metric", "query": {"promql": "max by (host_name, nodepool) ({__name__=\"karpenter_nodepools_usage\", resource_type=\"cpu\"}) / max by (host_name, nodepool) ({__name__=\"karpenter_nodepools_limit\", resource_type=\"cpu\"})"}, "condition": {"threshold": {"op": "gt", "value": 0.9}}, "every_s": 60, "window_s": 300, "for_s": 600, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "karpenter node pool near limit", "runbook_url": "https://docs.watchtower.example/runbooks/karpenter-alert"}}
    threshold_rationale: "Above 90% of the pool CPU limit Karpenter cannot add nodes for new pods."
    runbook_url: "https://docs.watchtower.example/runbooks/karpenter-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/karpenter/controller.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_json", "target": "body", "when": "starts_with(body, \"{\")"}, {"type": "parse_kv", "target": "body", "when": "contains(body, \"level=\")"}, {"type": "remap", "rename": {"msg": "message"}}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
