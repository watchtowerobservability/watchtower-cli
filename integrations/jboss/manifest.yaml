name: jboss
version: "1.0.0"
discovery:
  process_names: ["jboss", "wildfly"]
  ports: []
  k8s_labels: {"app.kubernetes.io/name": "wildfly"}
module:
  kind: jboss
  config_defaults: {"url": "http://127.0.0.1:8080/jolokia", "username": "CHANGE_ME", "password": "CHANGE_ME", "interval": "30s"}
metrics:
  - {name: "jboss.datasource.active", unit: "{connections}", description: "Connections in use per data source."}
  - {name: "jboss.datasource.available", unit: "{connections}", description: "Free connections per data source."}
  - {name: "jboss.datasource.timed_out", unit: "{connections}", description: "Connections that timed out (cumulative)."}
  - {name: "jboss.undertow.requests", unit: "{requests}", description: "HTTP requests per listener (cumulative)."}
  - {name: "jboss.undertow.errors", unit: "{requests}", description: "HTTP errors per listener (cumulative)."}
  - {name: "jboss.undertow.processing_time", unit: "ms", description: "Request processing time per listener (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Connections in use per data source", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"jboss.datasource.active\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Free connections per data source", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"jboss.datasource.available\"})"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Connections that timed out", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"jboss.datasource.timed_out\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p3", "title": "HTTP requests per listener", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"jboss.undertow.requests\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p4", "title": "HTTP errors per listener", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"jboss.undertow.errors\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p5", "title": "Request processing time per listener", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"jboss.undertow.processing_time\"}[5m]))"}, "options": {"unit": "short"}}]}
alerts:
  - name: "jboss unreachable"
    rule: {"name": "jboss unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"jboss\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "jboss unreachable", "runbook_url": ""}}
    threshold_rationale: "The jboss collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "jboss datasource exhausted"
    rule: {"name": "jboss datasource exhausted", "kind": "metric", "query": {"promql": "max by (host_name, name) ({__name__=\"jboss.datasource.available\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "jboss datasource exhausted", "runbook_url": "https://docs.watchtower.example/runbooks/jboss-alert"}}
    threshold_rationale: "No free connection in the pool: requests block until one frees up."
    runbook_url: "https://docs.watchtower.example/runbooks/jboss-alert"
    default_enabled: true
  - name: "jboss http errors"
    rule: {"name": "jboss http errors", "kind": "metric", "query": {"promql": "sum by (host_name) (increase({__name__=\"jboss.undertow.errors\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 10}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "jboss http errors", "runbook_url": "https://docs.watchtower.example/runbooks/jboss-alert"}}
    threshold_rationale: "Ten or more HTTP errors in 5 minutes on a listener."
    runbook_url: "https://docs.watchtower.example/runbooks/jboss-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/opt/jboss/standalone/log/server.log", "/opt/wildfly/standalone/log/server.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time} %{WORD:level} +\\[%{DATA:logger}\\] \\(%{DATA:thread}\\) %{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
