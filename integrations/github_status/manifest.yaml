name: github_status
version: "1.0.0"
discovery:
  process_names: []
  ports: []
  k8s_labels: {}
module:
  kind: github_status
  config_defaults: {"url": "https://githubstatus.com/api/v2/summary.json", "interval": "120s"}
metrics:
  - {name: "github_status.indicator", unit: "1", description: "GitHub overall status: 0 none, 1 minor, 2 major, 3 critical."}
  - {name: "github_status.component.status", unit: "1", description: "GitHub component status: 0 operational, 1 degraded, 2 partial outage, 3 major outage, 4 maintenance."}
  - {name: "github_status.incidents.active", unit: "{incidents}", description: "Unresolved GitHub incidents."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "GitHub overall status: 0 none, 1 minor, 2 major, 3 critical", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"github_status.indicator\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "GitHub component status: 0 operational, 1 degraded, 2 partia", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"github_status.component.status\"})"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Unresolved GitHub incidents", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"github_status.incidents.active\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "github_status unreachable"
    rule: {"name": "github_status unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"github_status\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "github_status unreachable", "runbook_url": ""}}
    threshold_rationale: "The github_status collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "github status incident"
    rule: {"name": "github status incident", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"github_status.indicator\"})"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "github status incident", "runbook_url": "https://docs.watchtower.example/runbooks/github_status-alert"}}
    threshold_rationale: "GitHub reports a degradation: failures against it may not be your code."
    runbook_url: "https://docs.watchtower.example/runbooks/github_status-alert"
    default_enabled: true
  - name: "github status major outage"
    rule: {"name": "github status major outage", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"github_status.indicator\"})"}, "condition": {"threshold": {"op": "gt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 120, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "github status major outage", "runbook_url": "https://docs.watchtower.example/runbooks/github_status-alert"}}
    threshold_rationale: "GitHub reports a major or critical outage."
    runbook_url: "https://docs.watchtower.example/runbooks/github_status-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
