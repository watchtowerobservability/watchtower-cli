name: envoy
version: "1.0.0"
discovery:
  process_names: ["envoy"]
  ports: [9901]
  k8s_labels: {"app.kubernetes.io/name": "envoy"}
module:
  kind: envoy
  config_defaults: {"url": "http://127.0.0.1:9901", "interval": "30s"}
metrics:
  - {name: "envoy_server_live", unit: "1", description: "1 while the server is live (not draining)."}
  - {name: "envoy_cluster_upstream_rq_total", unit: "{requests}", description: "Upstream requests per cluster (cumulative)."}
  - {name: "envoy_cluster_membership_healthy", unit: "{hosts}", description: "Healthy hosts per cluster."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Upstream requests/s", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name, envoy_cluster_name) (rate({__name__=\"envoy_cluster_upstream_rq_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Healthy hosts", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "min by (host_name, envoy_cluster_name) ({__name__=\"envoy_cluster_membership_healthy\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "envoy unreachable"
    rule: {"name": "envoy unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"envoy\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "envoy unreachable", "runbook_url": ""}}
    threshold_rationale: "The envoy collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "envoy cluster has no healthy hosts"
    rule: {"name": "envoy cluster has no healthy hosts", "kind": "metric", "query": {"promql": "min by (host_name, envoy_cluster_name) ({__name__=\"envoy_cluster_membership_healthy\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 120, "severity": "critical", "no_data": "ok", "labels": {}, "annotations": {"summary": "envoy cluster has no healthy hosts", "runbook_url": "https://docs.watchtower.example/runbooks/envoy-no-healthy-hosts"}}
    threshold_rationale: "Every request to a cluster without healthy hosts fails with 503."
    runbook_url: "https://docs.watchtower.example/runbooks/envoy-no-healthy-hosts"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/envoy/envoy.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "\\[%{DATA:time}\\]\\[%{NUMBER:thread}\\]\\[%{WORD:level}\\]\\[%{DATA:component}\\] %{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
