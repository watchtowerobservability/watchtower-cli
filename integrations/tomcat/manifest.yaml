name: tomcat
version: "1.0.0"
discovery:
  process_names: ["tomcat", "catalina", "tomcat9", "tomcat10"]
  ports: []
  k8s_labels: {"app.kubernetes.io/name": "tomcat"}
module:
  kind: tomcat
  config_defaults: {"url": "http://127.0.0.1:8778/jolokia", "interval": "30s"}
metrics:
  - {name: "tomcat.threads.busy", unit: "{threads}", description: "Busy threads of a connector's pool."}
  - {name: "tomcat.threads.max", unit: "{threads}", description: "Configured maxThreads of a connector."}
  - {name: "tomcat.requests", unit: "{requests}", description: "Requests per connector (cumulative)."}
  - {name: "tomcat.errors", unit: "{requests}", description: "Failed requests per connector (cumulative)."}
  - {name: "tomcat.sessions.active", unit: "{sessions}", description: "Active sessions per web application."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Requests/s", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name, connector) (rate({__name__=\"tomcat.requests\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Busy threads", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name, connector) ({__name__=\"tomcat.threads.busy\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "tomcat unreachable"
    rule: {"name": "tomcat unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"tomcat\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "tomcat unreachable", "runbook_url": ""}}
    threshold_rationale: "The tomcat collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "tomcat errors"
    rule: {"name": "tomcat errors", "kind": "metric", "query": {"promql": "max by (host_name, connector) (rate({__name__=\"tomcat.errors\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "tomcat errors", "runbook_url": "https://docs.watchtower.example/runbooks/tomcat-errors"}}
    threshold_rationale: "More than one failed request per second for 5 minutes on a connector."
    runbook_url: "https://docs.watchtower.example/runbooks/tomcat-errors"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/opt/tomcat/logs/catalina.*.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time} %{WORD:level} \\[%{DATA:thread}\\] %{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
