name: phpfpm
version: "1.0.0"
discovery:
  process_names: ["php-fpm"]
  ports: [9253]
  k8s_labels: {"app.kubernetes.io/name": "php-fpm"}
module:
  kind: phpfpm
  config_defaults: {"url": "http://127.0.0.1:9253", "interval": "30s"}
metrics:
  - {name: "phpfpm_up", unit: "1", description: "1 while the exporter reaches the PHP-FPM status page."}
  - {name: "phpfpm_active_processes", unit: "{processes}", description: "Workers serving a request now."}
  - {name: "phpfpm_idle_processes", unit: "{processes}", description: "Idle workers."}
  - {name: "phpfpm_total_processes", unit: "{processes}", description: "Workers in the pool."}
  - {name: "phpfpm_listen_queue", unit: "{connections}", description: "Connections waiting for a free worker."}
  - {name: "phpfpm_accepted_connections", unit: "{connections}", description: "Accepted connections (cumulative)."}
  - {name: "phpfpm_max_children_reached", unit: "{events}", description: "Times the pool hit pm.max_children (cumulative)."}
  - {name: "phpfpm_slow_requests", unit: "{requests}", description: "Requests slower than request_slowlog_timeout (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "1 while the exporter reaches the PHP-FPM status page", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"phpfpm_up\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Workers serving a request now", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"phpfpm_active_processes\"})"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Idle workers", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"phpfpm_idle_processes\"})"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Workers in the pool", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"phpfpm_total_processes\"})"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Connections waiting for a free worker", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"phpfpm_listen_queue\"})"}, "options": {"unit": "short"}}, {"id": "p5", "title": "Accepted connections", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"phpfpm_accepted_connections\"}[5m]))"}, "options": {"unit": "short"}}]}
alerts:
  - name: "phpfpm unreachable"
    rule: {"name": "phpfpm unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"phpfpm\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "phpfpm unreachable", "runbook_url": ""}}
    threshold_rationale: "The phpfpm collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "php-fpm pool exhausted"
    rule: {"name": "php-fpm pool exhausted", "kind": "metric", "query": {"promql": "sum by (host_name) (increase({__name__=\"phpfpm_max_children_reached\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "php-fpm pool exhausted", "runbook_url": "https://docs.watchtower.example/runbooks/phpfpm-alert"}}
    threshold_rationale: "pm.max_children reached means requests queue behind busy workers; raise the limit or fix slow code."
    runbook_url: "https://docs.watchtower.example/runbooks/phpfpm-alert"
    default_enabled: true
  - name: "php-fpm listen queue"
    rule: {"name": "php-fpm listen queue", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"phpfpm_listen_queue\"})"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "php-fpm listen queue", "runbook_url": "https://docs.watchtower.example/runbooks/phpfpm-alert"}}
    threshold_rationale: "A listen queue that stays above zero for 5 minutes means clients wait for a worker."
    runbook_url: "https://docs.watchtower.example/runbooks/phpfpm-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/php-fpm/error.log", "/var/log/php8*-fpm.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "\\[%{DATA:time}\\] %{WORD:level}: %{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
