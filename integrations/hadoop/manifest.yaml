name: hadoop
version: "1.0.0"
discovery:
  process_names: ["namenode", "resourcemanager"]
  ports: [9870, 8088]
  k8s_labels: {"app": "hadoop"}
module:
  kind: hadoop
  config_defaults: {"url": "http://127.0.0.1:8778/jolokia", "username": "CHANGE_ME", "password": "CHANGE_ME", "interval": "30s"}
metrics:
  - {name: "hadoop.namenode.capacity_total", unit: "By", description: "HDFS capacity."}
  - {name: "hadoop.namenode.capacity_used", unit: "By", description: "HDFS space used."}
  - {name: "hadoop.namenode.capacity_remaining", unit: "By", description: "HDFS space free."}
  - {name: "hadoop.namenode.under_replicated_blocks", unit: "{blocks}", description: "Blocks with fewer replicas than wanted."}
  - {name: "hadoop.namenode.missing_blocks", unit: "{blocks}", description: "Blocks with no live replica."}
  - {name: "hadoop.namenode.corrupt_blocks", unit: "{blocks}", description: "Blocks reported corrupt."}
  - {name: "hadoop.yarn.apps_running", unit: "{apps}", description: "YARN applications running."}
  - {name: "hadoop.yarn.apps_pending", unit: "{apps}", description: "YARN applications waiting for resources."}
  - {name: "hadoop.yarn.available_mb", unit: "MiBy", description: "Cluster memory free."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "HDFS capacity", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"hadoop.namenode.capacity_total\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "HDFS space used", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"hadoop.namenode.capacity_used\"})"}, "options": {"unit": "short"}}, {"id": "p2", "title": "HDFS space free", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"hadoop.namenode.capacity_remaining\"})"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Blocks with fewer replicas than wanted", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"hadoop.namenode.under_replicated_blocks\"})"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Blocks with no live replica", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"hadoop.namenode.missing_blocks\"})"}, "options": {"unit": "short"}}, {"id": "p5", "title": "Blocks reported corrupt", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"hadoop.namenode.corrupt_blocks\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "hadoop unreachable"
    rule: {"name": "hadoop unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"hadoop\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "hadoop unreachable", "runbook_url": ""}}
    threshold_rationale: "The hadoop collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "hadoop missing blocks"
    rule: {"name": "hadoop missing blocks", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"hadoop.namenode.missing_blocks\"})"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 60, "severity": "critical", "no_data": "ok", "labels": {}, "annotations": {"summary": "hadoop missing blocks", "runbook_url": "https://docs.watchtower.example/runbooks/hadoop-alert"}}
    threshold_rationale: "A block with no live replica is data loss unless a datanode returns."
    runbook_url: "https://docs.watchtower.example/runbooks/hadoop-alert"
    default_enabled: true
  - name: "hadoop hdfs nearly full"
    rule: {"name": "hadoop hdfs nearly full", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"hadoop.namenode.capacity_used\"}) / max by (host_name) ({__name__=\"hadoop.namenode.capacity_total\"})"}, "condition": {"threshold": {"op": "gt", "value": 0.85}}, "every_s": 60, "window_s": 300, "for_s": 900, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "hadoop hdfs nearly full", "runbook_url": "https://docs.watchtower.example/runbooks/hadoop-alert"}}
    threshold_rationale: "Above 85% HDFS gets slow to place blocks and rebalancing needs headroom."
    runbook_url: "https://docs.watchtower.example/runbooks/hadoop-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/hadoop/*.log", "/opt/hadoop/logs/*.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time} %{WORD:level} +%{DATA:logger}: %{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
