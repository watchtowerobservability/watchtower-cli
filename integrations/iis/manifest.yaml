name: iis
version: "1.0.0"
discovery:
  process_names: ["w3wp", "inetinfo"]
  ports: []
  k8s_labels: {"app.kubernetes.io/name": "iis"}
module:
  kind: iis
  config_defaults: {"url": "http://127.0.0.1:9182", "interval": "30s"}
metrics:
  - {name: "windows_iis_current_connections", unit: "{connections}", description: "Open connections per site."}
  - {name: "windows_iis_requests_total", unit: "{requests}", description: "Requests per site and method (cumulative)."}
  - {name: "windows_iis_not_found_errors_total", unit: "{requests}", description: "404 responses per site (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Requests/s by site", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name, site) (rate({__name__=\"windows_iis_requests_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Connections", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name, site) ({__name__=\"windows_iis_current_connections\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "iis unreachable"
    rule: {"name": "iis unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"iis\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "iis unreachable", "runbook_url": ""}}
    threshold_rationale: "The iis collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["C:\\inetpub\\logs\\LogFiles\\*\\*.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{NOTSPACE:date} %{NOTSPACE:time} %{NOTSPACE:s_ip} %{WORD:method} %{NOTSPACE:uri_stem} %{NOTSPACE:uri_query} %{NUMBER:port} %{NOTSPACE:username} %{NOTSPACE:c_ip} %{NOTSPACE:user_agent} %{NOTSPACE:referer} %{NUMBER:status} %{NUMBER:substatus} %{NUMBER:win32_status} %{NUMBER:time_taken}", "on_fail": "keep"}, {"type": "remap", "cast": {"status": "int", "time_taken": "int"}}]}}
