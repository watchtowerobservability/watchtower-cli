name: zookeeper
version: "1.0.0"
discovery:
  process_names: ["zookeeper", "zkServer.sh"]
  ports: [2181, 7000]
  k8s_labels: {"app.kubernetes.io/name": "zookeeper"}
module:
  kind: zookeeper
  config_defaults: {"url": "http://127.0.0.1:7000", "interval": "30s"}
metrics:
  - {name: "zookeeper_znode_count", unit: "{znodes}", description: "Znodes in the data tree."}
  - {name: "zookeeper_outstanding_requests", unit: "{requests}", description: "Requests queued in the server."}
  - {name: "zookeeper_num_alive_connections", unit: "{connections}", description: "Client connections."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Outstanding requests", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"zookeeper_outstanding_requests\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Connections", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"zookeeper_num_alive_connections\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "zookeeper unreachable"
    rule: {"name": "zookeeper unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"zookeeper\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "zookeeper unreachable", "runbook_url": ""}}
    threshold_rationale: "The zookeeper collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "zookeeper requests queued"
    rule: {"name": "zookeeper requests queued", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"zookeeper_outstanding_requests\"})"}, "condition": {"threshold": {"op": "gt", "value": 10}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "zookeeper requests queued", "runbook_url": "https://docs.watchtower.example/runbooks/zookeeper-outstanding"}}
    threshold_rationale: "Requests pile up faster than the server commits them: slow disk or an overloaded ensemble."
    runbook_url: "https://docs.watchtower.example/runbooks/zookeeper-outstanding"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/opt/zookeeper/logs/zookeeper.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time} \\[myid:%{DATA:myid}\\] - %{WORD:level} +\\[%{DATA:thread}\\] - %{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
