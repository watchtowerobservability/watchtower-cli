name: jenkins
version: "1.0.0"
discovery:
  process_names: ["jenkins", "jenkins.exe"]
  ports: []
  k8s_labels: {"app.kubernetes.io/name": "jenkins"}
module:
  kind: jenkins
  config_defaults: {"url": "http://127.0.0.1:8080", "username": "watchtower", "password": "CHANGE_ME", "interval": "60s"}
metrics:
  - {name: "jenkins.queue.size", unit: "{items}", description: "Items waiting in the build queue."}
  - {name: "jenkins.queue.oldest_wait", unit: "s", description: "How long the oldest queued item has waited."}
  - {name: "jenkins.executors.busy", unit: "{executors}", description: "Executors running a build."}
  - {name: "jenkins.executors.total", unit: "{executors}", description: "Executors on all agents."}
  - {name: "jenkins.nodes.offline", unit: "{nodes}", description: "Agents that are offline."}
  - {name: "jenkins.job.last_build.success", unit: "1", description: "1 when a job's last finished build succeeded, labelled job and result."}
  - {name: "jenkins.job.last_build.duration", unit: "s", description: "Duration of a job's last finished build."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Queue", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"jenkins.queue.size\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Busy executors", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"jenkins.executors.busy\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "jenkins unreachable"
    rule: {"name": "jenkins unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"jenkins\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "jenkins unreachable", "runbook_url": ""}}
    threshold_rationale: "The jenkins collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "jenkins queue stalled"
    rule: {"name": "jenkins queue stalled", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"jenkins.queue.oldest_wait\"})"}, "condition": {"threshold": {"op": "gt", "value": 900}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "jenkins queue stalled", "runbook_url": "https://docs.watchtower.example/runbooks/jenkins-queue-stalled"}}
    threshold_rationale: "A build waited more than 15 minutes for an executor: agents are offline or capacity is short."
    runbook_url: "https://docs.watchtower.example/runbooks/jenkins-queue-stalled"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/jenkins/jenkins.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time} \\[id=%{NUMBER:thread_id}\\]\\t%{WORD:level}\\t%{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
