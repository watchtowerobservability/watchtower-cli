name: artemis
version: "1.0.0"
discovery:
  process_names: ["artemis", "org.apache.activemq.artemis.boot.Artemis"]
  ports: [61616, 8161]
  k8s_labels: {"app.kubernetes.io/name": "artemis"}
module:
  kind: artemis
  config_defaults: {"url": "http://127.0.0.1:8161/console/jolokia", "username": "wt_monitor", "password": "CHANGE_ME", "interval": "30s"}
metrics:
  - {name: "artemis.queue.messages", unit: "{messages}", description: "Messages in the queue (at most 200 queues, deepest first; labels broker, address, queue, routing_type)."}
  - {name: "artemis.queue.consumers", unit: "{consumers}", description: "Consumers of the queue."}
  - {name: "artemis.queue.delivering", unit: "{messages}", description: "Delivered, not yet acknowledged."}
  - {name: "artemis.queue.scheduled", unit: "{messages}", description: "Scheduled for later delivery."}
  - {name: "artemis.queue.messages.added", unit: "{messages}", description: "Messages added (cumulative)."}
  - {name: "artemis.queue.messages.acknowledged", unit: "{messages}", description: "Messages acknowledged (cumulative)."}
  - {name: "artemis.queue.messages.expired", unit: "{messages}", description: "Messages expired (cumulative)."}
  - {name: "artemis.queue.messages.killed", unit: "{messages}", description: "Messages sent to the dead-letter address after max delivery attempts (cumulative)."}
  - {name: "artemis.queue.oldest_message_age", unit: "s", description: "Age of the first message in the queue (FirstMessageAge)."}
  - {name: "artemis.queue.paused", unit: "1", description: "1 while the queue is paused."}
  - {name: "artemis.broker.address_memory.used", unit: "By", description: "Memory used by all addresses."}
  - {name: "artemis.broker.address_memory.percent", unit: "%", description: "Address memory used against global-max-size; paging or blocking starts at 100."}
  - {name: "artemis.broker.disk.usage", unit: "1", description: "Fraction of the journal disk in use."}
  - {name: "artemis.broker.disk.max_usage", unit: "%", description: "max-disk-usage: above it producers are blocked."}
  - {name: "artemis.broker.connections", unit: "{connections}", description: "Open connections."}
  - {name: "artemis.broker.connections.created", unit: "{connections}", description: "Connections opened (cumulative)."}
  - {name: "artemis.broker.messages", unit: "{messages}", description: "Messages in all queues."}
  - {name: "artemis.broker.active", unit: "1", description: "1 while the broker is active (not a passive backup)."}
  - {name: "artemis.broker.replica_sync", unit: "1", description: "1 while the backup is in sync with the live broker."}
  - {name: "artemis.broker.backup", unit: "1", description: "1 on a backup broker."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Queue depth", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name, address, queue) ({__name__=\"artemis.queue.messages\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Oldest message age", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name, address, queue) ({__name__=\"artemis.queue.oldest_message_age\"})"}, "options": {"unit": "s"}}, {"id": "p2", "title": "Delivering", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name, address, queue) ({__name__=\"artemis.queue.delivering\"})"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Dead-lettered per second", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name, address, queue) (rate({__name__=\"artemis.queue.messages.killed\"}[5m]))"}, "options": {"unit": "ops"}}, {"id": "p4", "title": "Address memory", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name, broker) ({__name__=\"artemis.broker.address_memory.percent\"})"}, "options": {"unit": "percent"}}, {"id": "p5", "title": "Disk usage", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name, broker) ({__name__=\"artemis.broker.disk.usage\"})"}, "options": {"unit": "percentunit"}}]}
alerts:
  - name: "artemis unreachable"
    rule: {"name": "artemis unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"artemis\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "artemis unreachable", "runbook_url": ""}}
    threshold_rationale: "The artemis collector failed every round for 3 minutes: the broker or its Jolokia endpoint is down, or the agent's credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "Artemis address memory full"
    rule: {"name": "Artemis address memory full", "kind": "metric", "query": {"promql": "max by (host_name, broker) ({__name__=\"artemis.broker.address_memory.percent\"})"}, "condition": {"threshold": {"op": "gt", "value": 90}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "Artemis address memory full", "runbook_url": ""}}
    threshold_rationale: "Above 90% of global-max-size addresses start paging or blocking producers, depending on the address policy."
    runbook_url: ""
    default_enabled: true
  - name: "Artemis disk nearly full"
    rule: {"name": "Artemis disk nearly full", "kind": "metric", "query": {"promql": "max by (host_name, broker) ({__name__=\"artemis.broker.disk.usage\"})"}, "condition": {"threshold": {"op": "gt", "value": 0.85}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "Artemis disk nearly full", "runbook_url": ""}}
    threshold_rationale: "The journal disk is over 85% used; at max-disk-usage (default 90) the broker blocks every producer."
    runbook_url: ""
    default_enabled: true
  - name: "Artemis messages dead-lettered"
    rule: {"name": "Artemis messages dead-lettered", "kind": "metric", "query": {"promql": "sum by (host_name, address, queue) (increase({__name__=\"artemis.queue.messages.killed\"}[10m]))"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 600, "for_s": 0, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "Artemis messages dead-lettered", "runbook_url": ""}}
    threshold_rationale: "Messages exhausted their delivery attempts and moved to the dead-letter address: a consumer fails on them."
    runbook_url: ""
    default_enabled: true
  - name: "Artemis oldest message too old"
    rule: {"name": "Artemis oldest message too old", "kind": "metric", "query": {"promql": "max by (host_name, address, queue) ({__name__=\"artemis.queue.oldest_message_age\"})"}, "condition": {"threshold": {"op": "gt", "value": 900}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "Artemis oldest message too old", "runbook_url": ""}}
    threshold_rationale: "The first message has waited 15 minutes; tune per queue."
    runbook_url: ""
    default_enabled: false
  - name: "Artemis backup out of sync"
    rule: {"name": "Artemis backup out of sync", "kind": "metric", "query": {"promql": "min by (host_name, broker) ({__name__=\"artemis.broker.replica_sync\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 600, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "Artemis backup out of sync", "runbook_url": ""}}
    threshold_rationale: "The backup has not been in sync for 10 minutes; a failover now loses messages. Only meaningful with replication."
    runbook_url: ""
    default_enabled: false
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/lib/artemis/log/artemis.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time} %{WORD:level} +\\[%{DATA:logger}\\] %{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
