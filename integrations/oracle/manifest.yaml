name: oracle
version: "1.1.0"
discovery:
  process_names: ["oracle", "tnslsnr"]
  ports: [1521]
  k8s_labels: {"app.kubernetes.io/name": "oracle"}
module:
  kind: oracle
  config_defaults: {"dsn": "oracle://wt_monitor:CHANGE_ME@127.0.0.1:1521/ORCLPDB1", "interval": "30s"}
metrics:
  - {name: "oracle.commits", unit: "1", description: "User commits (cumulative, v$sysstat)."}
  - {name: "oracle.rollbacks", unit: "1", description: "User rollbacks (cumulative)."}
  - {name: "oracle.executions", unit: "1", description: "Statement executions (cumulative)."}
  - {name: "oracle.parses.hard", unit: "1", description: "Hard parses (cumulative); a high share of total parses means missing bind variables."}
  - {name: "oracle.parses.total", unit: "1", description: "All parses (cumulative)."}
  - {name: "oracle.physical_reads", unit: "1", description: "Blocks read from disk (cumulative)."}
  - {name: "oracle.logical_reads", unit: "1", description: "Session logical reads (cumulative)."}
  - {name: "oracle.redo_size", unit: "By", description: "Redo generated (cumulative)."}
  - {name: "oracle.wait.time", unit: "ms", description: "Time waited per non-idle wait class (cumulative, v$system_event)."}
  - {name: "oracle.sessions", unit: "{sessions}", description: "Sessions by status and type."}
  - {name: "oracle.tablespace.used_percent", unit: "%", description: "Tablespace use including autoextend headroom (dba_tablespace_usage_metrics)."}
  - {name: "db.sessions.blocked", unit: "{sessions}", description: "Sessions waiting on another session's lock."}
  - {name: "oracle.query.total_time", unit: "ms", description: "Per-sql_id elapsed time (dbm: true; agent running total from v$sqlarea)."}
  - {name: "oracle.query.calls", unit: "{calls}", description: "Per-sql_id executions (dbm: true)."}
  - {name: "oracle.query.buffer_gets", unit: "{blocks}", description: "Per-sql_id buffer gets (dbm: true)."}
  - {name: "oracle.query.mean_time", unit: "ms", description: "Per-sql_id mean elapsed time of the last round (dbm: true)."}
  - {name: "db.activity.sessions", unit: "{sessions}", description: "Average active sessions by schema and wait class from 1 s v$session samples (collect_samples: true)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Wait time by class", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (wait_class) (rate({__name__=\"oracle.wait.time\"}[5m]))"}, "options": {"unit": "ms"}}, {"id": "p1", "title": "Executions per second", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) (rate({__name__=\"oracle.executions\"}[5m]))"}, "options": {"unit": "ops"}}, {"id": "p2", "title": "Tablespace use", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (tablespace) ({__name__=\"oracle.tablespace.used_percent\"})"}, "options": {"unit": "percent"}}, {"id": "p3", "title": "Active sessions by wait class", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (\"db.wait_event_type\") ({__name__=\"db.activity.sessions\", \"db.system.name\"=\"oracle\"})"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Top SQL by time", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 24, "h": 8}, "query": {"kind": "promql", "text": "topk(10, sum by (sql_id, query) (rate({__name__=\"oracle.query.total_time\"}[5m])))"}, "options": {"unit": "ms"}}]}
alerts:
  - name: "oracle unreachable"
    rule: {"name": "oracle unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"oracle\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "oracle unreachable", "runbook_url": ""}}
    threshold_rationale: "The oracle collector failed every round for 3 minutes: the database or listener is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "Oracle tablespace nearly full"
    rule: {"name": "Oracle tablespace nearly full", "kind": "metric", "query": {"promql": "max by (host_name, tablespace) ({__name__=\"oracle.tablespace.used_percent\"})"}, "condition": {"threshold": {"op": "gt", "value": 90}}, "every_s": 300, "window_s": 900, "for_s": 900, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "Oracle tablespace nearly full", "runbook_url": ""}}
    threshold_rationale: "used_percent already counts autoextend headroom; past 90% inserts fail with ORA-01653 soon after."
    runbook_url: ""
    default_enabled: true
  - name: "Oracle blocked sessions"
    rule: {"name": "Oracle blocked sessions", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"db.sessions.blocked\", \"db.system\"=\"oracle\"})"}, "condition": {"threshold": {"op": "gt", "value": 5}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "Oracle blocked sessions", "runbook_url": ""}}
    threshold_rationale: "More than 5 sessions stuck behind locks for 5 minutes is a held transaction, not normal contention; the blocking_chain records name the root session."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/u01/app/oracle/diag/rdbms/*/*/trace/alert_*.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "ORA-%{NUMBER:ora_code}: %{GREEDYDATA:message}", "on_fail": "keep", "when": "contains(body, \"ORA-\")"}, {"type": "enrich", "set": {"db.system.name": "oracle"}}]}}
