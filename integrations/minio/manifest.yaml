name: minio
version: "1.0.0"
discovery:
  process_names: ["minio", "minio.exe"]
  ports: []
  k8s_labels: {"app.kubernetes.io/name": "minio"}
module:
  kind: minio
  config_defaults: {"url": "http://127.0.0.1:9000", "token": "CHANGE_ME", "interval": "30s"}
metrics:
  - {name: "minio_cluster_nodes_offline_total", unit: "{nodes}", description: "Server nodes offline."}
  - {name: "minio_cluster_capacity_usable_free_bytes", unit: "By", description: "Usable free capacity of the cluster."}
  - {name: "minio_s3_requests_total", unit: "{requests}", description: "S3 requests by API (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "S3 requests/s", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name, api) (rate({__name__=\"minio_s3_requests_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Free capacity", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "min by (host_name) ({__name__=\"minio_cluster_capacity_usable_free_bytes\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "minio unreachable"
    rule: {"name": "minio unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"minio\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "minio unreachable", "runbook_url": ""}}
    threshold_rationale: "The minio collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "minio node offline"
    rule: {"name": "minio node offline", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"minio_cluster_nodes_offline_total\"})"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "minio node offline", "runbook_url": "https://docs.watchtower.example/runbooks/minio-node-offline"}}
    threshold_rationale: "A node is offline: erasure sets run degraded and another failure may lose write quorum."
    runbook_url: "https://docs.watchtower.example/runbooks/minio-node-offline"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/minio/minio.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_json", "target": "body", "when": "starts_with(body, \"{\")"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
