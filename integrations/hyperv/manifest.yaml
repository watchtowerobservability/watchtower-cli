name: hyperv
version: "1.0.0"
discovery:
  process_names: ["vmms.exe"]
  ports: []
  k8s_labels: {}
module:
  kind: hyperv
  config_defaults: {"url": "http://127.0.0.1:9182/metrics", "interval": "30s"}
metrics:
  - {name: "windows_hyperv_vm_cpu_total_run_time", unit: "1", description: "Hyper-V guest CPU run time."}
  - {name: "windows_hyperv_health_ok", unit: "1", description: "Hyper-V health counters (critical/ok)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "windows_hyperv_vm_cpu_total_run_time", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"windows_hyperv_vm_cpu_total_run_time\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "hyperv unreachable"
    rule: {"name": "hyperv unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"hyperv\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "hyperv unreachable", "runbook_url": ""}}
    threshold_rationale: "The hyperv collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["eventlog://Microsoft-Windows-Hyper-V-Worker-Admin", "eventlog://Microsoft-Windows-Hyper-V-VMMS-Admin"], "pipeline": {"version": 1, "stages": [{"type": "parse_json", "target": "body", "when": "starts_with(body, \"{\")"}]}}
