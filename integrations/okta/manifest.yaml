name: okta
version: "1.0.0"
discovery:
  process_names: []
  ports: []
  k8s_labels: {}
module:
  kind: okta
  config_defaults: {"url": "https://CHANGE_ME.okta.com", "token": "CHANGE_ME", "interval": "60s"}
metrics:
  - {name: "okta.system_log.events", unit: "{events}", description: "System log events by event_type and outcome (cumulative since agent start)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "System log events by event_type and outcome", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"okta.system_log.events\"}[5m]))"}, "options": {"unit": "short"}}]}
alerts:
  - name: "okta unreachable"
    rule: {"name": "okta unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"okta\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "okta unreachable", "runbook_url": ""}}
    threshold_rationale: "The okta collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "okta failed sign-ins"
    rule: {"name": "okta failed sign-ins", "kind": "metric", "query": {"promql": "sum by (host_name) (increase({__name__=\"okta.system_log.events\", event_type=\"user.session.start\", outcome=\"FAILURE\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 50}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "okta failed sign-ins", "runbook_url": "https://docs.watchtower.example/runbooks/okta-alert"}}
    threshold_rationale: "Fifty or more failed sign-ins in 5 minutes looks like credential stuffing or an IdP misconfiguration."
    runbook_url: "https://docs.watchtower.example/runbooks/okta-alert"
    default_enabled: true
  - name: "okta rate limit"
    rule: {"name": "okta rate limit", "kind": "metric", "query": {"promql": "sum by (host_name) (increase({__name__=\"okta.system_log.events\", event_type=\"system.org.rate_limit.violation\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "okta rate limit", "runbook_url": "https://docs.watchtower.example/runbooks/okta-alert"}}
    threshold_rationale: "Okta is throttling this org's API calls."
    runbook_url: "https://docs.watchtower.example/runbooks/okta-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["okta://system-log"], "pipeline": {"version": 1, "stages": [{"type": "parse_json", "target": "body", "when": "starts_with(body, \"{\")"}, {"type": "remap", "rename": {"displayMessage": "message"}}, {"type": "remap", "set_severity": {"from": "severity", "map": {"debug": "DEBUG", "info": "INFO", "warn": "WARN", "error": "ERROR"}}}]}}
