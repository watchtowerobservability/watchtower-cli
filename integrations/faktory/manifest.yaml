name: faktory
version: "1.0.0"
discovery:
  process_names: ["faktory"]
  ports: [7419]
  k8s_labels: {}
module:
  kind: faktory
  config_defaults: {"addr": "127.0.0.1:7419", "password": "CHANGE_ME", "interval": "30s"}
metrics:
  - {name: "job_queue_jobs", unit: "{jobs}", description: "Jobs per queue and state (waiting, active, scheduled, retry, dead and framework extras); completed jobs are not counted."}
  - {name: "job_queue_workers", unit: "{workers}", description: "Live worker processes (queue \"*\" when the store does not split them by queue)."}
  - {name: "job_queue_processed_total", unit: "{jobs}", description: "Jobs processed, as the framework counts them (cumulative)."}
  - {name: "job_queue_failed_total", unit: "{jobs}", description: "Job failures, as the framework counts them (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Waiting jobs", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (queue) ({__name__=\"job_queue_jobs\", framework=\"faktory\", state=\"waiting\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Jobs by state", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (queue, state) ({__name__=\"job_queue_jobs\", framework=\"faktory\", state!=\"waiting\"})"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Processed per second", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (queue) (rate({__name__=\"job_queue_processed_total\", framework=\"faktory\"}[5m]))"}, "options": {"unit": "ops"}}, {"id": "p3", "title": "Workers", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (queue) ({__name__=\"job_queue_workers\", framework=\"faktory\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "Faktory queue backlog"
    rule: {"name": "Faktory queue backlog", "kind": "metric", "query": {"promql": "max by (host_name, queue) ({__name__=\"job_queue_jobs\", framework=\"faktory\", state=\"waiting\"})"}, "condition": {"threshold": {"op": "gt", "value": 1000}}, "every_s": 60, "window_s": 300, "for_s": 600, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "Faktory queue backlog", "runbook_url": ""}}
    threshold_rationale: "More than 1000 jobs ready to run for 10 minutes means workers are not keeping up; tune per queue."
    runbook_url: ""
    default_enabled: true
  - name: "Faktory dead jobs rising"
    rule: {"name": "Faktory dead jobs rising", "kind": "metric", "query": {"promql": "max by (host_name, queue) (delta({__name__=\"job_queue_jobs\", framework=\"faktory\", state=\"dead\"}[10m]))"}, "condition": {"threshold": {"op": "gt", "value": 10}}, "every_s": 60, "window_s": 600, "for_s": 0, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "Faktory dead jobs rising", "runbook_url": ""}}
    threshold_rationale: "More than 10 jobs exhausted their retries in 10 minutes; a queue that should never fail can lower it to 0."
    runbook_url: ""
    default_enabled: true
  - name: "Faktory no workers"
    rule: {"name": "Faktory no workers", "kind": "metric", "query": {"promql": "max by (host_name, queue) ({__name__=\"job_queue_workers\", framework=\"faktory\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "Faktory no workers", "runbook_url": ""}}
    threshold_rationale: "No live worker process for 5 minutes: nothing runs and every queue only grows."
    runbook_url: ""
    default_enabled: true
  - name: "faktory unreachable"
    rule: {"name": "faktory unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"faktory\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "faktory unreachable", "runbook_url": ""}}
    threshold_rationale: "The faktory collector failed every round for 3 minutes: the store is down, refusing connections, or the agent's credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/faktory/*.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_json", "target": "body", "when": "starts_with(body, \"{\")"}, {"type": "parse_kv", "target": "body", "when": "contains(body, \"level=\")"}, {"type": "remap", "rename": {"msg": "message"}}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
