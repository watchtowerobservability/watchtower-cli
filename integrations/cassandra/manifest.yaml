name: cassandra
version: "1.0.0"
discovery:
  process_names: ["cassandra", "CassandraDaemon"]
  ports: [9042]
  k8s_labels: {"app.kubernetes.io/name": "cassandra"}
module:
  kind: cassandra
  config_defaults: {"url": "http://127.0.0.1:8778/jolokia", "interval": "30s"}
metrics:
  - {name: "cassandra_stats", unit: "1", description: "Node stats from the cassandra-exporter."}
  - {name: "cassandra_table_pending_compactions", unit: "{tasks}", description: "Pending compactions per table."}
  - {name: "cassandra_dropped_messages_total", unit: "{messages}", description: "Dropped messages by type (cumulative)."}
  - {name: "cassandra.table.read.latency.p99", unit: "us", description: "Local read latency p99 per table (Jolokia mode)."}
  - {name: "cassandra.table.write.latency.p99", unit: "us", description: "Local write latency p99 per table."}
  - {name: "cassandra.table.reads", unit: "{requests}", description: "Local reads per table (cumulative)."}
  - {name: "cassandra.table.writes", unit: "{requests}", description: "Local writes per table (cumulative)."}
  - {name: "cassandra.table.tombstones_scanned.p99", unit: "{tombstones}", description: "Tombstones scanned per read, p99, per table."}
  - {name: "cassandra.table.tombstones_scanned.max", unit: "{tombstones}", description: "Most tombstones one read scanned, per table."}
  - {name: "cassandra.table.sstables_per_read.p99", unit: "{sstables}", description: "SSTables touched per read, p99, per table."}
  - {name: "cassandra.table.pending_compactions", unit: "{tasks}", description: "Pending compactions per table."}
  - {name: "cassandra.table.disk.live", unit: "By", description: "Live SSTable bytes per table."}
  - {name: "cassandra.compaction.pending", unit: "{tasks}", description: "Pending compactions on the node."}
  - {name: "cassandra.compaction.completed", unit: "{tasks}", description: "Completed compactions (cumulative)."}
  - {name: "cassandra.compaction.bytes", unit: "By", description: "Bytes compacted (cumulative)."}
  - {name: "cassandra.client_request.latency.p99", unit: "us", description: "Coordinator latency p99 by operation (read, write, rangeslice, casread, ...)."}
  - {name: "cassandra.client_request.timeouts", unit: "{requests}", description: "Coordinator timeouts by operation (cumulative)."}
  - {name: "cassandra.client_request.unavailables", unit: "{requests}", description: "Requests refused for too few live replicas (cumulative)."}
  - {name: "cassandra.thread_pool.pending", unit: "{tasks}", description: "Pending tasks per stage (MutationStage, ReadStage, ...)."}
  - {name: "cassandra.thread_pool.blocked", unit: "{tasks}", description: "Blocked tasks per stage."}
  - {name: "cassandra.dropped_messages", unit: "{messages}", description: "Dropped messages by verb (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "cassandra_stats", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"cassandra_stats\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Read p99 by table", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "topk(10, max by (host_name, \"db.namespace\", \"db.collection.name\") ({__name__=\"cassandra.table.read.latency.p99\"}))"}, "options": {"unit": "us"}}, {"id": "p2", "title": "Tombstones per read p99", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "topk(10, max by (host_name, \"db.namespace\", \"db.collection.name\") ({__name__=\"cassandra.table.tombstones_scanned.p99\"}))"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Pending compactions", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"cassandra.compaction.pending\"})"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Coordinator timeouts", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name, \"db.operation.name\") (rate({__name__=\"cassandra.client_request.timeouts\"}[5m]))"}, "options": {"unit": "ops"}}]}
alerts:
  - name: "cassandra unreachable"
    rule: {"name": "cassandra unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"cassandra\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "cassandra unreachable", "runbook_url": ""}}
    threshold_rationale: "The cassandra collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "Cassandra tombstone-heavy reads"
    rule: {"name": "Cassandra tombstone-heavy reads", "kind": "metric", "query": {"promql": "max by (host_name, \"db.namespace\", \"db.collection.name\") ({__name__=\"cassandra.table.tombstones_scanned.p99\"})"}, "condition": {"threshold": {"op": "gt", "value": 1000}}, "every_s": 300, "window_s": 900, "for_s": 900, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "Cassandra tombstone-heavy reads", "runbook_url": ""}}
    threshold_rationale: "The default tombstone_warn_threshold is 1000; reads past it are slow and at 100000 they fail."
    runbook_url: ""
    default_enabled: true
  - name: "Cassandra compaction backlog"
    rule: {"name": "Cassandra compaction backlog", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"cassandra.compaction.pending\"})"}, "condition": {"threshold": {"op": "gt", "value": 100}}, "every_s": 60, "window_s": 900, "for_s": 900, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "Cassandra compaction backlog", "runbook_url": ""}}
    threshold_rationale: "A backlog over 100 for 15 minutes means compaction cannot keep up, and SSTables per read (read latency) will climb."
    runbook_url: ""
    default_enabled: true
  - name: "Cassandra dropped messages"
    rule: {"name": "Cassandra dropped messages", "kind": "metric", "query": {"promql": "sum by (host_name, verb) (increase({__name__=\"cassandra.dropped_messages\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "Cassandra dropped messages", "runbook_url": ""}}
    threshold_rationale: "Dropped mutations or reads mean the node is overloaded and consistency relies on repair."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/cassandra/system.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{WORD:level} +\\[%{DATA:thread}\\] %{DATA:time} %{DATA:source} - %{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
