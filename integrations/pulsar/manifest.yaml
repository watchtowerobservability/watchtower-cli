name: pulsar
version: "1.1.0"
discovery:
  process_names: ["pulsar", "org.apache.pulsar.PulsarBrokerStarter"]
  ports: [8080]
  k8s_labels: {"app.kubernetes.io/name": "pulsar"}
module:
  kind: pulsar
  config_defaults: {"url": "http://127.0.0.1:8080", "interval": "30s"}
metrics:
  - {name: "pulsar_msg_backlog", unit: "{messages}", description: "Backlog per topic."}
  - {name: "pulsar_rate_in", unit: "{messages}/s", description: "Messages per second in, per topic."}
  - {name: "pulsar_subscriptions_count", unit: "{subscriptions}", description: "Subscriptions per topic."}
  - {name: "pulsar_subscription_back_log", unit: "{messages}", description: "Backlog per topic and subscription."}
  - {name: "pulsar_subscription_unacked_messages", unit: "{messages}", description: "Delivered, not yet acknowledged, per subscription."}
  - {name: "pulsar_subscription_msg_rate_redeliver", unit: "{messages}/s", description: "Redeliveries per second, per subscription."}
  - {name: "pulsar_storage_size", unit: "By", description: "Storage used per topic."}
  - {name: "pulsar.subscription.backlog_age", unit: "s", description: "Age of the oldest unconsumed message (admin API, the 20 most backlogged topics; Pulsar 2.11+)."}
  - {name: "pulsar.subscription.last_ack_age", unit: "s", description: "Seconds since the subscription last acknowledged, while it has a backlog."}
  - {name: "pulsar.subscription.consumers", unit: "{consumers}", description: "Consumers attached to the subscription."}
  - {name: "pulsar.subscription.blocked_on_unacked", unit: "1", description: "1 while the broker stopped dispatching because of too many unacknowledged messages."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Backlog per topic", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name, topic) ({__name__=\"pulsar_msg_backlog\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Subscription backlog", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name, topic, subscription) ({__name__=\"pulsar_subscription_back_log\"})"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Backlog age", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name, topic, subscription) ({__name__=\"pulsar.subscription.backlog_age\"})"}, "options": {"unit": "s"}}, {"id": "p3", "title": "Redeliveries per second", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name, topic, subscription) ({__name__=\"pulsar_subscription_msg_rate_redeliver\"})"}, "options": {"unit": "ops"}}]}
alerts:
  - name: "pulsar unreachable"
    rule: {"name": "pulsar unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"pulsar\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "pulsar unreachable", "runbook_url": ""}}
    threshold_rationale: "The pulsar collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "Pulsar subscription backlog too old"
    rule: {"name": "Pulsar subscription backlog too old", "kind": "metric", "query": {"promql": "max by (host_name, topic, subscription) ({__name__=\"pulsar.subscription.backlog_age\"})"}, "condition": {"threshold": {"op": "gt", "value": 900}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "Pulsar subscription backlog too old", "runbook_url": ""}}
    threshold_rationale: "The oldest unconsumed message is over 15 minutes old; tune per subscription."
    runbook_url: ""
    default_enabled: true
  - name: "Pulsar subscription blocked on unacked"
    rule: {"name": "Pulsar subscription blocked on unacked", "kind": "metric", "query": {"promql": "max by (host_name, topic, subscription) ({__name__=\"pulsar.subscription.blocked_on_unacked\"})"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "Pulsar subscription blocked on unacked", "runbook_url": ""}}
    threshold_rationale: "The broker stopped dispatching to the subscription: consumers hold maxUnackedMessagesPerSubscription without acking."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/pulsar/logs/pulsar.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time} \\[%{DATA:thread}\\] %{WORD:level} +%{DATA:logger} - %{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
