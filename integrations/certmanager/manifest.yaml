name: certmanager
version: "1.0.0"
discovery:
  process_names: ["cert-manager"]
  ports: [9402]
  k8s_labels: {"app.kubernetes.io/name": "cert-manager"}
module:
  kind: certmanager
  config_defaults: {"url": "http://127.0.0.1:9402", "interval": "30s"}
metrics:
  - {name: "certmanager_certificate_ready_status", unit: "1", description: "1 for the condition (True, False, Unknown) a certificate is in, per certificate."}
  - {name: "certmanager_certificate_expiration_timestamp_seconds", unit: "s", description: "Unix time each certificate expires."}
  - {name: "certmanager_certificate_renewal_timestamp_seconds", unit: "s", description: "Unix time cert-manager will renew each certificate."}
  - {name: "certmanager_http_acme_client_request_count", unit: "{requests}", description: "ACME requests by status (cumulative)."}
  - {name: "certmanager_controller_sync_call_count", unit: "{syncs}", description: "Controller sync calls (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "1 for the condition", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"certmanager_certificate_ready_status\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Unix time each certificate expires", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"certmanager_certificate_expiration_timestamp_seconds\"})"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Unix time cert-manager will renew each certificate", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"certmanager_certificate_renewal_timestamp_seconds\"})"}, "options": {"unit": "short"}}, {"id": "p3", "title": "ACME requests by status", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"certmanager_http_acme_client_request_count\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Controller sync calls", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"certmanager_controller_sync_call_count\"}[5m]))"}, "options": {"unit": "short"}}]}
alerts:
  - name: "certmanager unreachable"
    rule: {"name": "certmanager unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"certmanager\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "certmanager unreachable", "runbook_url": ""}}
    threshold_rationale: "The certmanager collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "cert-manager certificate not ready"
    rule: {"name": "cert-manager certificate not ready", "kind": "metric", "query": {"promql": "max by (host_name, name, namespace) ({__name__=\"certmanager_certificate_ready_status\", condition=\"False\"})"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 900, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "cert-manager certificate not ready", "runbook_url": "https://docs.watchtower.example/runbooks/certmanager-alert"}}
    threshold_rationale: "A certificate stuck not-ready for 15 minutes is failing issuance or renewal and will expire."
    runbook_url: "https://docs.watchtower.example/runbooks/certmanager-alert"
    default_enabled: true
  - name: "cert-manager ACME errors"
    rule: {"name": "cert-manager ACME errors", "kind": "metric", "query": {"promql": "sum by (host_name) (increase({__name__=\"certmanager_http_acme_client_request_count\", status=~\"[45]..\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 5}}, "every_s": 60, "window_s": 300, "for_s": 600, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "cert-manager ACME errors", "runbook_url": "https://docs.watchtower.example/runbooks/certmanager-alert"}}
    threshold_rationale: "Repeated ACME 4xx/5xx replies mean challenges or rate limits are blocking issuance."
    runbook_url: "https://docs.watchtower.example/runbooks/certmanager-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/cert-manager/cert-manager.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{WORD:level_char}%{NUMBER:date} %{DATA:time} +%{NUMBER:pid} %{GREEDYDATA:message}", "on_fail": "keep"}]}}
