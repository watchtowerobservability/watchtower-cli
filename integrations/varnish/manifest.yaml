name: varnish
version: "1.0.0"
discovery:
  process_names: ["varnishd"]
  ports: [9131]
  k8s_labels: {"app": "varnish"}
module:
  kind: varnish
  config_defaults: {"url": "http://127.0.0.1:9131", "interval": "30s"}
metrics:
  - {name: "varnish_up", unit: "1", description: "1 while the exporter reaches varnishstat."}
  - {name: "varnish_main_client_req", unit: "{requests}", description: "Client requests (cumulative)."}
  - {name: "varnish_main_cache_hit", unit: "{requests}", description: "Cache hits (cumulative)."}
  - {name: "varnish_main_cache_miss", unit: "{requests}", description: "Cache misses (cumulative)."}
  - {name: "varnish_main_backend_fail", unit: "{connections}", description: "Failed backend connections (cumulative)."}
  - {name: "varnish_main_sess_dropped", unit: "{sessions}", description: "Sessions dropped for lack of threads (cumulative)."}
  - {name: "varnish_main_threads", unit: "{threads}", description: "Worker threads."}
  - {name: "varnish_main_n_object", unit: "{objects}", description: "Objects in cache."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "1 while the exporter reaches varnishstat", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"varnish_up\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Client requests", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"varnish_main_client_req\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Cache hits", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"varnish_main_cache_hit\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Cache misses", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"varnish_main_cache_miss\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Failed backend connections", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"varnish_main_backend_fail\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p5", "title": "Sessions dropped for lack of threads", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"varnish_main_sess_dropped\"}[5m]))"}, "options": {"unit": "short"}}]}
alerts:
  - name: "varnish unreachable"
    rule: {"name": "varnish unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"varnish\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "varnish unreachable", "runbook_url": ""}}
    threshold_rationale: "The varnish collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "varnish backend failures"
    rule: {"name": "varnish backend failures", "kind": "metric", "query": {"promql": "sum by (host_name) (increase({__name__=\"varnish_main_backend_fail\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "varnish backend failures", "runbook_url": "https://docs.watchtower.example/runbooks/varnish-alert"}}
    threshold_rationale: "Failed backend connections mean cache misses turn into errors."
    runbook_url: "https://docs.watchtower.example/runbooks/varnish-alert"
    default_enabled: true
  - name: "varnish sessions dropped"
    rule: {"name": "varnish sessions dropped", "kind": "metric", "query": {"promql": "sum by (host_name) (increase({__name__=\"varnish_main_sess_dropped\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "varnish sessions dropped", "runbook_url": "https://docs.watchtower.example/runbooks/varnish-alert"}}
    threshold_rationale: "Dropped sessions mean thread_pool_max is too low for the load."
    runbook_url: "https://docs.watchtower.example/runbooks/varnish-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/varnish/varnishncsa.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{IPORHOST:client} %{USER:ident} %{USER:auth} \\[%{HTTPDATE:time}\\] \"%{WORD:method} %{NOTSPACE:path} HTTP/%{NUMBER:http_version}\" %{NUMBER:status} %{NUMBER:bytes}", "on_fail": "keep"}]}}
