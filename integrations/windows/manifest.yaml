name: windows
version: "1.0.0"
discovery:
  process_names: ["windows_exporter.exe", "w3wp.exe"]
  ports: [9182]
  k8s_labels: {}
module:
  kind: windows
  config_defaults: {"url": "http://127.0.0.1:9182/metrics", "interval": "30s"}
metrics:
  - {name: "windows_cpu_time_total", unit: "s", description: "CPU time per core and mode."}
  - {name: "windows_os_physical_memory_free_bytes", unit: "By", description: "Free physical memory."}
  - {name: "windows_iis_current_connections", unit: "{connections}", description: "IIS current connections per site."}
  - {name: "windows_service_state", unit: "1", description: "Windows service state."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "windows_cpu_time_total", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"windows_cpu_time_total\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "windows unreachable"
    rule: {"name": "windows unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"windows\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "windows unreachable", "runbook_url": ""}}
    threshold_rationale: "The windows collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["eventlog://Application", "eventlog://System"], "pipeline": {"version": 1, "stages": [{"type": "parse_json", "target": "body", "when": "starts_with(body, \"{\")"}]}}
