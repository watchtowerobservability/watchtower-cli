name: puma
version: "1.0.0"
discovery:
  process_names: ["puma"]
  ports: [9394]
  k8s_labels: {"app.kubernetes.io/name": "puma"}
module:
  kind: puma
  config_defaults: {"url": "http://127.0.0.1:9394", "interval": "30s"}
metrics:
  - {name: "puma_backlog", unit: "{requests}", description: "Requests waiting for a free thread."}
  - {name: "puma_running", unit: "{threads}", description: "Threads running now."}
  - {name: "puma_pool_capacity", unit: "{threads}", description: "Threads free to take a request."}
  - {name: "puma_max_threads", unit: "{threads}", description: "Configured thread ceiling."}
  - {name: "puma_workers", unit: "{workers}", description: "Configured workers (cluster mode)."}
  - {name: "puma_booted_workers", unit: "{workers}", description: "Workers booted."}
  - {name: "puma_requests_count", unit: "{requests}", description: "Requests handled (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Requests waiting for a free thread", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"puma_backlog\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Threads running now", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"puma_running\"})"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Threads free to take a request", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"puma_pool_capacity\"})"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Configured thread ceiling", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"puma_max_threads\"})"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Configured workers", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"puma_workers\"})"}, "options": {"unit": "short"}}, {"id": "p5", "title": "Workers booted", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"puma_booted_workers\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "puma unreachable"
    rule: {"name": "puma unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"puma\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "puma unreachable", "runbook_url": ""}}
    threshold_rationale: "The puma collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "puma backlog"
    rule: {"name": "puma backlog", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"puma_backlog\"})"}, "condition": {"threshold": {"op": "gt", "value": 5}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "puma backlog", "runbook_url": "https://docs.watchtower.example/runbooks/puma-alert"}}
    threshold_rationale: "A standing backlog means all threads are busy and requests queue."
    runbook_url: "https://docs.watchtower.example/runbooks/puma-alert"
    default_enabled: true
  - name: "puma workers missing"
    rule: {"name": "puma workers missing", "kind": "metric", "query": {"promql": "min by (host_name) ({__name__=\"puma_booted_workers\"}) / min by (host_name) ({__name__=\"puma_workers\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "puma workers missing", "runbook_url": "https://docs.watchtower.example/runbooks/puma-alert"}}
    threshold_rationale: "Fewer booted workers than configured for 5 minutes: a worker is crash-looping or was OOM-killed."
    runbook_url: "https://docs.watchtower.example/runbooks/puma-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/puma/puma.log", "/var/log/puma/puma_error.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "\\[%{NUMBER:pid}\\] %{GREEDYDATA:message}", "on_fail": "keep"}]}}
