name: rq
version: "1.0.0"
discovery:
  process_names: []
  ports: []
  k8s_labels: {}
module:
  kind: rq
  config_defaults: {"addr": "127.0.0.1:6379", "password": "CHANGE_ME", "interval": "30s"}
metrics:
  - {name: "job_queue_jobs", unit: "{jobs}", description: "Jobs per queue and state (waiting, active, scheduled, retry, dead and framework extras); completed jobs are not counted."}
  - {name: "job_queue_oldest_waiting_age_seconds", unit: "s", description: "Seconds since the oldest waiting job became ready (0 when nothing waits)."}
  - {name: "job_queue_stalled_jobs", unit: "{jobs}", description: "Jobs held by a worker past their lease or stall_after."}
  - {name: "job_queue_workers", unit: "{workers}", description: "Live worker processes (queue \"*\" when the store does not split them by queue)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Waiting jobs", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (queue) ({__name__=\"job_queue_jobs\", framework=\"rq\", state=\"waiting\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Oldest waiting job age", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (queue) ({__name__=\"job_queue_oldest_waiting_age_seconds\", framework=\"rq\"})"}, "options": {"unit": "s"}}, {"id": "p2", "title": "Jobs by state", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (queue, state) ({__name__=\"job_queue_jobs\", framework=\"rq\", state!=\"waiting\"})"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Dead jobs added (10m)", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (queue) (clamp_min(delta({__name__=\"job_queue_jobs\", framework=\"rq\", state=\"dead\"}[10m]), 0))"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Stalled jobs", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (queue) ({__name__=\"job_queue_stalled_jobs\", framework=\"rq\"})"}, "options": {"unit": "short"}}, {"id": "p5", "title": "Workers", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (queue) ({__name__=\"job_queue_workers\", framework=\"rq\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "RQ queue backlog"
    rule: {"name": "RQ queue backlog", "kind": "metric", "query": {"promql": "max by (host_name, queue) ({__name__=\"job_queue_jobs\", framework=\"rq\", state=\"waiting\"})"}, "condition": {"threshold": {"op": "gt", "value": 1000}}, "every_s": 60, "window_s": 300, "for_s": 600, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "RQ queue backlog", "runbook_url": ""}}
    threshold_rationale: "More than 1000 jobs ready to run for 10 minutes means workers are not keeping up; tune per queue."
    runbook_url: ""
    default_enabled: true
  - name: "RQ oldest waiting job too old"
    rule: {"name": "RQ oldest waiting job too old", "kind": "metric", "query": {"promql": "max by (host_name, queue) ({__name__=\"job_queue_oldest_waiting_age_seconds\", framework=\"rq\"})"}, "condition": {"threshold": {"op": "gt", "value": 300}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "RQ oldest waiting job too old", "runbook_url": ""}}
    threshold_rationale: "A job ready for more than 5 minutes means workers are down, stuck or too few for the load; tune per queue."
    runbook_url: ""
    default_enabled: true
  - name: "RQ dead jobs rising"
    rule: {"name": "RQ dead jobs rising", "kind": "metric", "query": {"promql": "max by (host_name, queue) (delta({__name__=\"job_queue_jobs\", framework=\"rq\", state=\"dead\"}[10m]))"}, "condition": {"threshold": {"op": "gt", "value": 10}}, "every_s": 60, "window_s": 600, "for_s": 0, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "RQ dead jobs rising", "runbook_url": ""}}
    threshold_rationale: "More than 10 jobs exhausted their retries in 10 minutes; a queue that should never fail can lower it to 0."
    runbook_url: ""
    default_enabled: true
  - name: "RQ stalled jobs"
    rule: {"name": "RQ stalled jobs", "kind": "metric", "query": {"promql": "max by (host_name, queue) ({__name__=\"job_queue_stalled_jobs\", framework=\"rq\"})"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 600, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "RQ stalled jobs", "runbook_url": ""}}
    threshold_rationale: "Jobs held by a worker past their lease or stall_after: the worker crashed or the job hangs."
    runbook_url: ""
    default_enabled: true
  - name: "RQ no workers"
    rule: {"name": "RQ no workers", "kind": "metric", "query": {"promql": "max by (host_name, queue) ({__name__=\"job_queue_workers\", framework=\"rq\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "RQ no workers", "runbook_url": ""}}
    threshold_rationale: "No live worker process for 5 minutes: nothing runs and every queue only grows."
    runbook_url: ""
    default_enabled: true
  - name: "rq unreachable"
    rule: {"name": "rq unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"rq\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "rq unreachable", "runbook_url": ""}}
    threshold_rationale: "The rq collector failed every round for 3 minutes: the store is down, refusing connections, or the agent's credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/rq/*.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_json", "target": "body", "when": "starts_with(body, \"{\")"}, {"type": "parse_kv", "target": "body", "when": "contains(body, \"level=\")"}, {"type": "remap", "rename": {"msg": "message"}}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
