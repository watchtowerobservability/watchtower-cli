name: cilium
version: "1.0.0"
discovery:
  process_names: ["cilium-agent"]
  ports: [9962]
  k8s_labels: {"k8s-app": "cilium"}
module:
  kind: cilium
  config_defaults: {"url": "http://127.0.0.1:9962", "interval": "30s"}
metrics:
  - {name: "cilium_endpoint_state", unit: "{endpoints}", description: "Endpoints by state (ready, regenerating, not-ready, ...)."}
  - {name: "cilium_drop_count_total", unit: "{packets}", description: "Dropped packets by reason and direction (cumulative)."}
  - {name: "cilium_forward_count_total", unit: "{packets}", description: "Forwarded packets by direction (cumulative)."}
  - {name: "cilium_unreachable_nodes", unit: "{nodes}", description: "Nodes this agent cannot reach."}
  - {name: "cilium_bpf_map_ops_total", unit: "{operations}", description: "BPF map operations by map and outcome (cumulative)."}
  - {name: "hubble_flows_processed_total", unit: "{flows}", description: "Flows Hubble processed (cumulative)."}
  - {name: "hubble_drop_total", unit: "{packets}", description: "Packets Hubble saw dropped (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Endpoints by state", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"cilium_endpoint_state\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Dropped packets by reason and direction", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"cilium_drop_count_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Forwarded packets by direction", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"cilium_forward_count_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Nodes this agent cannot reach", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"cilium_unreachable_nodes\"})"}, "options": {"unit": "short"}}, {"id": "p4", "title": "BPF map operations by map and outcome", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"cilium_bpf_map_ops_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p5", "title": "Flows Hubble processed", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"hubble_flows_processed_total\"}[5m]))"}, "options": {"unit": "short"}}]}
alerts:
  - name: "cilium unreachable"
    rule: {"name": "cilium unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"cilium\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "cilium unreachable", "runbook_url": ""}}
    threshold_rationale: "The cilium collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "cilium unreachable nodes"
    rule: {"name": "cilium unreachable nodes", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"cilium_unreachable_nodes\"})"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "cilium unreachable nodes", "runbook_url": "https://docs.watchtower.example/runbooks/cilium-alert"}}
    threshold_rationale: "Unreachable nodes for 5 minutes mean broken node-to-node connectivity or a dead agent."
    runbook_url: "https://docs.watchtower.example/runbooks/cilium-alert"
    default_enabled: true
  - name: "cilium packet drops"
    rule: {"name": "cilium packet drops", "kind": "metric", "query": {"promql": "sum by (host_name) (rate({__name__=\"cilium_drop_count_total\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 50}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "cilium packet drops", "runbook_url": "https://docs.watchtower.example/runbooks/cilium-alert"}}
    threshold_rationale: "A sustained drop rate points at policy denials, a missing route or exhausted maps."
    runbook_url: "https://docs.watchtower.example/runbooks/cilium-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/run/cilium/cilium.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "time=\"%{DATA:time}\" level=%{WORD:level} msg=\"%{DATA:message}\"%{GREEDYDATA:fields}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
