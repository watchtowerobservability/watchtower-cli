name: ceph
version: "1.0.0"
discovery:
  process_names: ["ceph-mgr", "ceph-mon"]
  ports: [9283]
  k8s_labels: {"app.kubernetes.io/name": "ceph"}
module:
  kind: ceph
  config_defaults: {"url": "http://127.0.0.1:9283/metrics", "interval": "30s"}
metrics:
  - {name: "ceph_health_status", unit: "1", description: "0 ok, 1 warning, 2 error."}
  - {name: "ceph_osd_up", unit: "1", description: "1 while the OSD is up."}
  - {name: "ceph_pool_percent_used", unit: "1", description: "Fraction of the pool in use."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "ceph_health_status", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"ceph_health_status\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "ceph unreachable"
    rule: {"name": "ceph unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"ceph\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "ceph unreachable", "runbook_url": ""}}
    threshold_rationale: "The ceph collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/ceph/*.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time} %{DATA:thread} +%{NUMBER:debug_level} %{GREEDYDATA:message}", "on_fail": "keep"}]}}
