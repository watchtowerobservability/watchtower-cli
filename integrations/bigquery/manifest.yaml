name: bigquery
version: "1.0.0"
discovery:
  process_names: []
  ports: []
  k8s_labels: {}
module:
  kind: cloud_pull
  config_defaults: {"pulls": [{"provider": "gcp", "interval_s": 300, "config": {"project": "CHANGE_ME", "presets": ["bigquery"], "service_account": {"client_email": "CHANGE_ME", "private_key": "CHANGE_ME"}}}]}
metrics:
  - {name: "cloud.gcp.bigquery.job.num_in_flight", unit: "{jobs}", description: "Jobs running or queued."}
  - {name: "cloud.gcp.bigquery.slots.allocated_for_project", unit: "{slots}", description: "Slots allocated to the project."}
  - {name: "cloud.gcp.bigquery.storage.stored_bytes", unit: "By", description: "Bytes stored per dataset."}
  - {name: "cloud.gcp.bigquery.query.scanned_bytes_billed", unit: "By", description: "Bytes billed for queries."}
  - {name: "cloud.gcp.bigquery.query.count", unit: "{queries}", description: "Queries in flight."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Jobs running or queued", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"cloud.gcp.bigquery.job.num_in_flight\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Slots allocated to the project", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"cloud.gcp.bigquery.slots.allocated_for_project\"})"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Bytes stored per dataset", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"cloud.gcp.bigquery.storage.stored_bytes\"})"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Bytes billed for queries", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"cloud.gcp.bigquery.query.scanned_bytes_billed\"})"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Queries in flight", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"cloud.gcp.bigquery.query.count\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "bigquery jobs queueing"
    rule: {"name": "bigquery jobs queueing", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"cloud.gcp.bigquery.job.num_in_flight\"})"}, "condition": {"threshold": {"op": "gt", "value": 100}}, "every_s": 60, "window_s": 300, "for_s": 900, "severity": "warning", "no_data": "alerting", "labels": {}, "annotations": {"summary": "bigquery jobs queueing", "runbook_url": "https://docs.watchtower.example/runbooks/bigquery-alert"}}
    threshold_rationale: "More than 100 jobs in flight for 15 minutes: queries queue behind each other or slots are exhausted."
    runbook_url: "https://docs.watchtower.example/runbooks/bigquery-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["gcp://cloudaudit.googleapis.com/data_access"], "pipeline": {"version": 1, "stages": [{"type": "parse_json", "target": "body", "when": "starts_with(body, \"{\")"}, {"type": "remap", "set_severity": {"from": "severity", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
