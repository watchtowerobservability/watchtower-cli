name: jmx
version: "1.0.0"
discovery:
  process_names: []
  ports: [8778]
  k8s_labels: {}
module:
  kind: jmx
  config_defaults: {"url": "http://127.0.0.1:8778/jolokia", "interval": "30s"}
metrics:
  - {name: "jmx.attribute", unit: "1", description: "A numeric JMX attribute, labelled with mbean and attribute (JVM memory, threads, GC by default)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "jmx.attribute", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"jmx.attribute\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "jmx unreachable"
    rule: {"name": "jmx unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"jmx\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "jmx unreachable", "runbook_url": ""}}
    threshold_rationale: "The jmx collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/app/*.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time} %{WORD:level} +\\[%{DATA:thread}\\] %{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
