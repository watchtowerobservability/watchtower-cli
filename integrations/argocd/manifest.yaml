name: argocd
version: "1.0.0"
discovery:
  process_names: ["argocd-application-controller"]
  ports: [8082]
  k8s_labels: {"app.kubernetes.io/name": "argocd-metrics"}
module:
  kind: argocd
  config_defaults: {"url": "http://127.0.0.1:8082", "interval": "30s"}
metrics:
  - {name: "argocd_app_info", unit: "1", description: "One series per application with sync_status and health_status labels."}
  - {name: "argocd_app_sync_total", unit: "{syncs}", description: "Syncs by application and phase (cumulative)."}
  - {name: "argocd_cluster_connection_status", unit: "1", description: "1 while Argo CD reaches the cluster."}
  - {name: "argocd_git_request_total", unit: "{requests}", description: "Git requests by type (cumulative)."}
  - {name: "argocd_redis_request_total", unit: "{requests}", description: "Redis requests (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "One series per application with sync_status and health_statu", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"argocd_app_info\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Syncs by application and phase", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"argocd_app_sync_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p2", "title": "1 while Argo CD reaches the cluster", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"argocd_cluster_connection_status\"})"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Git requests by type", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"argocd_git_request_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Redis requests", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"argocd_redis_request_total\"}[5m]))"}, "options": {"unit": "short"}}]}
alerts:
  - name: "argocd unreachable"
    rule: {"name": "argocd unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"argocd\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "argocd unreachable", "runbook_url": ""}}
    threshold_rationale: "The argocd collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "argocd app out of sync"
    rule: {"name": "argocd app out of sync", "kind": "metric", "query": {"promql": "max by (host_name, name) ({__name__=\"argocd_app_info\", sync_status=\"OutOfSync\"})"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 1800, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "argocd app out of sync", "runbook_url": "https://docs.watchtower.example/runbooks/argocd-alert"}}
    threshold_rationale: "Out of sync for 30 minutes: drift or a failed sync that nobody noticed."
    runbook_url: "https://docs.watchtower.example/runbooks/argocd-alert"
    default_enabled: true
  - name: "argocd app degraded"
    rule: {"name": "argocd app degraded", "kind": "metric", "query": {"promql": "max by (host_name, name) ({__name__=\"argocd_app_info\", health_status=\"Degraded\"})"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 600, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "argocd app degraded", "runbook_url": "https://docs.watchtower.example/runbooks/argocd-alert"}}
    threshold_rationale: "A Degraded application has unhealthy resources after a sync."
    runbook_url: "https://docs.watchtower.example/runbooks/argocd-alert"
    default_enabled: true
  - name: "argocd cluster disconnected"
    rule: {"name": "argocd cluster disconnected", "kind": "metric", "query": {"promql": "max by (host_name, server) ({__name__=\"argocd_cluster_connection_status\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "argocd cluster disconnected", "runbook_url": "https://docs.watchtower.example/runbooks/argocd-alert"}}
    threshold_rationale: "Argo CD cannot reach a target cluster: syncs to it fail."
    runbook_url: "https://docs.watchtower.example/runbooks/argocd-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/argocd/application-controller.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "time=\"%{DATA:time}\" level=%{WORD:level} msg=\"%{DATA:message}\"%{GREEDYDATA:fields}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
