name: mssql
version: "1.1.0"
discovery:
  process_names: ["sqlservr", "sqlservr.exe"]
  ports: [1433]
  k8s_labels: {"app.kubernetes.io/name": "mssql"}
module:
  kind: mssql
  config_defaults: {"dsn": "sqlserver://wt_monitor:CHANGE_ME@127.0.0.1:1433?database=master", "interval": "30s"}
metrics:
  - {name: "mssql.performance_counter", unit: "1", description: "sys.dm_os_performance_counters (cumulative), labelled object and counter."}
  - {name: "mssql.wait.time", unit: "ms", description: "Accumulated wait time of the top 25 wait types (cumulative)."}
  - {name: "mssql.wait.tasks", unit: "{tasks}", description: "Waits per wait type (cumulative)."}
  - {name: "mssql.blocking.wait", unit: "ms", description: "How long each blocked request has waited, labelled waiting and blocking session."}
  - {name: "db.sessions.blocked", unit: "{sessions}", description: "Blocked requests (dbm: true)."}
  - {name: "db.blocking.chain_depth", unit: "{sessions}", description: "Depth of the longest blocking chain (dbm: true)."}
  - {name: "mssql.query.calls", unit: "{calls}", description: "Per-query_hash executions from the plan cache (dbm: true; agent running total)."}
  - {name: "mssql.query.total_time", unit: "ms", description: "Per-query_hash elapsed time (dbm: true; agent running total)."}
  - {name: "mssql.query.logical_reads", unit: "{pages}", description: "Per-query_hash logical reads (dbm: true)."}
  - {name: "mssql.query.physical_reads", unit: "{pages}", description: "Per-query_hash physical reads (dbm: true)."}
  - {name: "mssql.query.mean_time", unit: "ms", description: "Per-query_hash mean elapsed time of the last round (dbm: true)."}
  - {name: "mssql.query_store.state", unit: "1", description: "1 for the Query Store's actual state (READ_WRITE, READ_ONLY, OFF, ERROR) of the connected database."}
  - {name: "mssql.query_store.storage_utilization", unit: "1", description: "Query Store storage used / max_storage_size_mb."}
  - {name: "mssql.query_store.plans", unit: "{plans}", description: "Plans used in the last hour by queries with more than one."}
  - {name: "mssql.query_store.regression_ratio", unit: "1", description: "Worst / best mean duration across a query's plans in the last hour."}
  - {name: "db.activity.sessions", unit: "{sessions}", description: "Average running requests by database, status and wait category (collect_samples: true)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Top waits", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "topk(10, sum by (wait_type) (rate({__name__=\"mssql.wait.time\"}[5m])))"}, "options": {"unit": "ms"}}, {"id": "p1", "title": "Blocked requests", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"db.sessions.blocked\", \"db.system\"=\"mssql\"})"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Top queries by time", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 24, "h": 8}, "query": {"kind": "promql", "text": "topk(10, sum by (query_hash, query) (rate({__name__=\"mssql.query.total_time\"}[5m])))"}, "options": {"unit": "ms"}}, {"id": "p3", "title": "Active requests by wait", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (\"db.wait_event_type\") ({__name__=\"db.activity.sessions\", \"db.system.name\"=\"mssql\"})"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Query Store storage", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"mssql.query_store.storage_utilization\"})"}, "options": {"unit": "percentunit"}}]}
alerts:
  - name: "mssql unreachable"
    rule: {"name": "mssql unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"mssql\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "mssql unreachable", "runbook_url": ""}}
    threshold_rationale: "The mssql collector failed every round for 3 minutes: SQL Server is down, refusing connections, or the agent's credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "SQL Server blocking"
    rule: {"name": "SQL Server blocking", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"mssql.blocking.wait\"})"}, "condition": {"threshold": {"op": "gt", "value": 30000}}, "every_s": 60, "window_s": 300, "for_s": 120, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "SQL Server blocking", "runbook_url": ""}}
    threshold_rationale: "A request blocked for more than 30 s for 2 minutes is a stuck transaction holding locks, not ordinary contention; the blocking_chain records name the root."
    runbook_url: ""
    default_enabled: true
  - name: "SQL Server Query Store nearly full"
    rule: {"name": "SQL Server Query Store nearly full", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"mssql.query_store.storage_utilization\"})"}, "condition": {"threshold": {"op": "gt", "value": 0.9}}, "every_s": 300, "window_s": 900, "for_s": 900, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "SQL Server Query Store nearly full", "runbook_url": ""}}
    threshold_rationale: "At max_storage_size_mb the store turns READ_ONLY and stops capturing plans and regressions without any error."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/opt/mssql/log/errorlog"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time} %{DATA:source} +%{GREEDYDATA:message}", "on_fail": "keep"}]}}
