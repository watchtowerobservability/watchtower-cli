name: calico
version: "1.0.0"
discovery:
  process_names: ["calico-node"]
  ports: [9091]
  k8s_labels: {"k8s-app": "calico-node"}
module:
  kind: calico
  config_defaults: {"url": "http://127.0.0.1:9091", "interval": "30s"}
metrics:
  - {name: "felix_active_local_endpoints", unit: "{endpoints}", description: "Local workload endpoints Felix programs."}
  - {name: "felix_cluster_num_hosts", unit: "{hosts}", description: "Hosts in the cluster as Felix sees them."}
  - {name: "felix_int_dataplane_failures", unit: "{failures}", description: "Dataplane programming failures (cumulative)."}
  - {name: "felix_ipset_errors", unit: "{errors}", description: "ipset command errors (cumulative)."}
  - {name: "felix_iptables_restore_errors", unit: "{errors}", description: "iptables-restore errors (cumulative)."}
  - {name: "felix_resyncs_started", unit: "{resyncs}", description: "Datastore resyncs started (cumulative)."}
  - {name: "typha_connections_active", unit: "{connections}", description: "Felix connections to Typha."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Local workload endpoints Felix programs", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"felix_active_local_endpoints\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Hosts in the cluster as Felix sees them", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"felix_cluster_num_hosts\"})"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Dataplane programming failures", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"felix_int_dataplane_failures\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p3", "title": "ipset command errors", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"felix_ipset_errors\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p4", "title": "iptables-restore errors", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"felix_iptables_restore_errors\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p5", "title": "Datastore resyncs started", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"felix_resyncs_started\"}[5m]))"}, "options": {"unit": "short"}}]}
alerts:
  - name: "calico unreachable"
    rule: {"name": "calico unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"calico\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "calico unreachable", "runbook_url": ""}}
    threshold_rationale: "The calico collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "calico dataplane failures"
    rule: {"name": "calico dataplane failures", "kind": "metric", "query": {"promql": "sum by (host_name) (increase({__name__=\"felix_int_dataplane_failures\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "calico dataplane failures", "runbook_url": "https://docs.watchtower.example/runbooks/calico-alert"}}
    threshold_rationale: "Felix failed to program the dataplane: network policy may be out of date on the node."
    runbook_url: "https://docs.watchtower.example/runbooks/calico-alert"
    default_enabled: true
  - name: "calico iptables errors"
    rule: {"name": "calico iptables errors", "kind": "metric", "query": {"promql": "sum by (host_name) (increase({__name__=\"felix_iptables_restore_errors\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "calico iptables errors", "runbook_url": "https://docs.watchtower.example/runbooks/calico-alert"}}
    threshold_rationale: "Repeated iptables-restore errors leave rules half applied."
    runbook_url: "https://docs.watchtower.example/runbooks/calico-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/calico/felix.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time} \\[%{WORD:level}\\]\\[%{DATA:pid}\\] %{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
