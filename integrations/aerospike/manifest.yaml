name: aerospike
version: "1.0.0"
discovery:
  process_names: ["asd"]
  ports: [9145]
  k8s_labels: {"app": "aerospike"}
module:
  kind: aerospike
  config_defaults: {"url": "http://127.0.0.1:9145", "interval": "30s"}
metrics:
  - {name: "aerospike_node_up", unit: "1", description: "1 while the node answers the exporter."}
  - {name: "aerospike_node_stats_client_connections", unit: "{connections}", description: "Client connections per node."}
  - {name: "aerospike_namespace_objects", unit: "{objects}", description: "Objects stored per namespace."}
  - {name: "aerospike_namespace_memory_used_bytes", unit: "By", description: "Memory used per namespace."}
  - {name: "aerospike_namespace_client_read_error", unit: "{requests}", description: "Failed client reads (cumulative)."}
  - {name: "aerospike_namespace_client_write_error", unit: "{requests}", description: "Failed client writes (cumulative)."}
  - {name: "aerospike_namespace_stop_writes", unit: "1", description: "1 when the namespace refuses writes (memory or disk high-water mark)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "1 while the node answers the exporter", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"aerospike_node_up\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Client connections per node", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"aerospike_node_stats_client_connections\"})"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Objects stored per namespace", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"aerospike_namespace_objects\"})"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Memory used per namespace", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"aerospike_namespace_memory_used_bytes\"})"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Failed client reads", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"aerospike_namespace_client_read_error\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p5", "title": "Failed client writes", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"aerospike_namespace_client_write_error\"}[5m]))"}, "options": {"unit": "short"}}]}
alerts:
  - name: "aerospike unreachable"
    rule: {"name": "aerospike unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"aerospike\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "aerospike unreachable", "runbook_url": ""}}
    threshold_rationale: "The aerospike collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "aerospike stop-writes"
    rule: {"name": "aerospike stop-writes", "kind": "metric", "query": {"promql": "max by (host_name, ns) ({__name__=\"aerospike_namespace_stop_writes\"})"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 60, "severity": "critical", "no_data": "ok", "labels": {}, "annotations": {"summary": "aerospike stop-writes", "runbook_url": "https://docs.watchtower.example/runbooks/aerospike-alert"}}
    threshold_rationale: "Stop-writes means the namespace rejects every write until space is freed."
    runbook_url: "https://docs.watchtower.example/runbooks/aerospike-alert"
    default_enabled: true
  - name: "aerospike write errors"
    rule: {"name": "aerospike write errors", "kind": "metric", "query": {"promql": "sum by (host_name) (increase({__name__=\"aerospike_namespace_client_write_error\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "aerospike write errors", "runbook_url": "https://docs.watchtower.example/runbooks/aerospike-alert"}}
    threshold_rationale: "Sustained write errors mean clients lose data or retry endlessly."
    runbook_url: "https://docs.watchtower.example/runbooks/aerospike-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/aerospike/aerospike.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time}: %{WORD:level} \\(%{DATA:context}\\): \\(%{DATA:source}\\) %{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
