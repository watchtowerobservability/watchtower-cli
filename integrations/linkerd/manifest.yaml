name: linkerd
version: "1.0.0"
discovery:
  process_names: ["linkerd2-proxy"]
  ports: [4191]
  k8s_labels: {"app.kubernetes.io/name": "linkerd"}
module:
  kind: linkerd
  config_defaults: {"url": "http://127.0.0.1:4191", "interval": "30s"}
metrics:
  - {name: "linkerd_request_total", unit: "{requests}", description: "Requests through the proxy by direction and route (cumulative)."}
  - {name: "linkerd_response_total", unit: "{responses}", description: "Responses by classification (success or failure) and status (cumulative)."}
  - {name: "linkerd_tcp_open_connections", unit: "{connections}", description: "Open TCP connections."}
  - {name: "linkerd_tcp_open_total", unit: "{connections}", description: "TCP connections opened (cumulative)."}
  - {name: "linkerd_tcp_close_total", unit: "{connections}", description: "TCP connections closed by errno (cumulative)."}
  - {name: "linkerd_identity_cert_expiry_timestamp_seconds", unit: "s", description: "Unix time the proxy's mTLS identity certificate expires."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Requests through the proxy by direction and route", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"linkerd_request_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Responses by classification", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"linkerd_response_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Open TCP connections", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"linkerd_tcp_open_connections\"})"}, "options": {"unit": "short"}}, {"id": "p3", "title": "TCP connections opened", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"linkerd_tcp_open_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p4", "title": "TCP connections closed by errno", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"linkerd_tcp_close_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p5", "title": "Unix time the proxy's mTLS identity certificate expires", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"linkerd_identity_cert_expiry_timestamp_seconds\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "linkerd unreachable"
    rule: {"name": "linkerd unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"linkerd\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "linkerd unreachable", "runbook_url": ""}}
    threshold_rationale: "The linkerd collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "linkerd failing responses"
    rule: {"name": "linkerd failing responses", "kind": "metric", "query": {"promql": "sum by (host_name) (rate({__name__=\"linkerd_response_total\", classification=\"failure\"}[5m])) / sum by (host_name) (rate({__name__=\"linkerd_response_total\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 0.05}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "linkerd failing responses", "runbook_url": "https://docs.watchtower.example/runbooks/linkerd-alert"}}
    threshold_rationale: "More than 5% of mesh responses classified as failures for 5 minutes means a meshed workload is erroring or unreachable."
    runbook_url: "https://docs.watchtower.example/runbooks/linkerd-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/linkerd/proxy.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_json", "target": "body", "when": "starts_with(body, \"{\")"}, {"type": "parse_kv", "target": "body", "when": "contains(body, \"level=\")"}, {"type": "remap", "rename": {"msg": "message"}}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
