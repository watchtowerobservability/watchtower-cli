name: docker
version: "1.0.0"
discovery:
  process_names: ["dockerd", "docker"]
  ports: []
  k8s_labels: {}
module:
  kind: docker
  config_defaults: {"socket": "/var/run/docker.sock", "interval": "30s"}
metrics:
  - {name: "docker.container.up", unit: "1", description: "1 while the container runs, per container."}
  - {name: "docker.containers", unit: "{containers}", description: "Containers per state."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "docker.container.up", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"docker.container.up\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "docker unreachable"
    rule: {"name": "docker unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"docker\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "docker unreachable", "runbook_url": ""}}
    threshold_rationale: "The docker collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/docker.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_kv", "target": "body", "when": "contains(body, \"level=\")"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
