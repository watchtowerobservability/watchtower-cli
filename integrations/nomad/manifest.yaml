name: nomad
version: "1.0.0"
discovery:
  process_names: ["nomad", "nomad.exe"]
  ports: [4646]
  k8s_labels: {"app.kubernetes.io/name": "nomad"}
module:
  kind: nomad
  config_defaults: {"url": "http://127.0.0.1:4646", "token": "CHANGE_ME", "interval": "30s"}
metrics:
  - {name: "nomad_client_allocations_running", unit: "{allocations}", description: "Allocations running on a client."}
  - {name: "nomad_nomad_blocked_evals_total_blocked", unit: "{evaluations}", description: "Evaluations blocked for lack of capacity."}
  - {name: "nomad_nomad_job_summary_failed", unit: "{allocations}", description: "Failed allocations per job and task group."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Running allocations", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) ({__name__=\"nomad_client_allocations_running\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Blocked evaluations", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"nomad_nomad_blocked_evals_total_blocked\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "nomad unreachable"
    rule: {"name": "nomad unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"nomad\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "nomad unreachable", "runbook_url": ""}}
    threshold_rationale: "The nomad collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "nomad evaluations blocked"
    rule: {"name": "nomad evaluations blocked", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"nomad_nomad_blocked_evals_total_blocked\"})"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 600, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "nomad evaluations blocked", "runbook_url": "https://docs.watchtower.example/runbooks/nomad-blocked-evals"}}
    threshold_rationale: "Work waited 10 minutes for capacity: the cluster cannot place every allocation."
    runbook_url: "https://docs.watchtower.example/runbooks/nomad-blocked-evals"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/nomad/nomad.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time} \\[%{WORD:level}\\] +%{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
