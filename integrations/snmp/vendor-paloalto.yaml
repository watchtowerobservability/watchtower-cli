# Palo Alto PAN-OS vendor profile (INF-015): PAN-COMMON-MIB panSession and GlobalProtect gateway
# utilization. CPU and memory come from HOST-RESOURCES-MIB, which the profile also polls.
name: vendor-paloalto
scalars:
  - {oid: 1.3.6.1.4.1.25461.2.1.2.3.1.0, metric: snmp.sessions.utilization, unit: "%"}
  - {oid: 1.3.6.1.4.1.25461.2.1.2.3.2.0, metric: snmp.sessions.limit, unit: "{session}"}
  - {oid: 1.3.6.1.4.1.25461.2.1.2.3.3.0, metric: snmp.sessions.active, unit: "{session}"}
  - {oid: 1.3.6.1.4.1.25461.2.1.2.3.4.0, metric: snmp.sessions.active, unit: "{session}", attrs: {network.transport: tcp}}
  - {oid: 1.3.6.1.4.1.25461.2.1.2.3.5.0, metric: snmp.sessions.active, unit: "{session}", attrs: {network.transport: udp}}
  - {oid: 1.3.6.1.4.1.25461.2.1.2.3.6.0, metric: snmp.sessions.active, unit: "{session}", attrs: {network.transport: icmp}}
  - {oid: 1.3.6.1.4.1.25461.2.1.2.5.1.1.0, metric: snmp.vpn.tunnels.utilization, unit: "%"}
  - {oid: 1.3.6.1.4.1.25461.2.1.2.5.1.2.0, metric: snmp.vpn.tunnels.limit, unit: "{tunnel}"}
  - {oid: 1.3.6.1.4.1.25461.2.1.2.5.1.3.0, metric: snmp.vpn.tunnels.active, unit: "{tunnel}"}
