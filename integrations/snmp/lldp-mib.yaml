# LLDP-MIB (IEEE 802.1AB) subtrees the topology walker (P3-I6) reads through snmp.Walk.
# No metrics come from here; the file lists what to walk.
name: lldp-mib
walk:
  - 1.0.8802.1.1.2.1.3.2.0     # lldpLocChassisId
  - 1.0.8802.1.1.2.1.3.3.0     # lldpLocSysName
  - 1.0.8802.1.1.2.1.3.7.1     # lldpLocPortTable
  - 1.0.8802.1.1.2.1.4.1.1     # lldpRemTable
  - 1.0.8802.1.1.2.1.4.2.1     # lldpRemManAddrTable
