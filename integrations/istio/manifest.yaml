name: istio
version: "1.0.0"
discovery:
  process_names: ["pilot-discovery"]
  ports: [15014]
  k8s_labels: {"app.kubernetes.io/name": "istiod"}
module:
  kind: istio
  config_defaults: {"url": "http://127.0.0.1:15014", "interval": "30s"}
metrics:
  - {name: "pilot_xds_pushes", unit: "{pushes}", description: "xDS pushes by type (cumulative)."}
  - {name: "pilot_xds", unit: "{proxies}", description: "Proxies connected to this istiod."}
  - {name: "pilot_total_xds_rejects", unit: "{rejects}", description: "Configs the proxies rejected (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Connected proxies", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) ({__name__=\"pilot_xds\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "xDS pushes/s", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name, type) (rate({__name__=\"pilot_xds_pushes\"}[5m]))"}, "options": {"unit": "short"}}]}
alerts:
  - name: "istio unreachable"
    rule: {"name": "istio unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"istio\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "istio unreachable", "runbook_url": ""}}
    threshold_rationale: "The istio collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "istio config rejected"
    rule: {"name": "istio config rejected", "kind": "metric", "query": {"promql": "max by (host_name) (increase({__name__=\"pilot_total_xds_rejects\"}[15m]))"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 900, "for_s": 0, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "istio config rejected", "runbook_url": "https://docs.watchtower.example/runbooks/istio-xds-rejects"}}
    threshold_rationale: "A proxy refused pushed config: the mesh runs on stale routes until the bad resource is fixed."
    runbook_url: "https://docs.watchtower.example/runbooks/istio-xds-rejects"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/istio/istiod.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time}\\t%{WORD:level}\\t%{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
