name: fastly
version: "1.0.0"
discovery:
  process_names: []
  ports: []
  k8s_labels: {}
module:
  kind: fastly
  config_defaults: {"url": "http://127.0.0.1:8080", "interval": "30s", "token": "CHANGE_ME"}
metrics:
  - {name: "fastly_rt_requests_total", unit: "{requests}", description: "Edge requests by service (cumulative)."}
  - {name: "fastly_rt_hits_total", unit: "{requests}", description: "Cache hits (cumulative)."}
  - {name: "fastly_rt_miss_total", unit: "{requests}", description: "Cache misses (cumulative)."}
  - {name: "fastly_rt_errors_total", unit: "{requests}", description: "Edge errors (cumulative)."}
  - {name: "fastly_rt_origin_fetches_total", unit: "{requests}", description: "Origin fetches (cumulative)."}
  - {name: "fastly_rt_bandwidth_total", unit: "By", description: "Bytes delivered (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Edge requests by service", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"fastly_rt_requests_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Cache hits", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"fastly_rt_hits_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Cache misses", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"fastly_rt_miss_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Edge errors", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"fastly_rt_errors_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Origin fetches", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"fastly_rt_origin_fetches_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p5", "title": "Bytes delivered", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"fastly_rt_bandwidth_total\"}[5m]))"}, "options": {"unit": "short"}}]}
alerts:
  - name: "fastly unreachable"
    rule: {"name": "fastly unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"fastly\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "fastly unreachable", "runbook_url": ""}}
    threshold_rationale: "The fastly collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "fastly error ratio"
    rule: {"name": "fastly error ratio", "kind": "metric", "query": {"promql": "sum by (host_name, service_name) (rate({__name__=\"fastly_rt_errors_total\"}[5m])) / sum by (host_name, service_name) (rate({__name__=\"fastly_rt_requests_total\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 0.02}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "fastly error ratio", "runbook_url": "https://docs.watchtower.example/runbooks/fastly-alert"}}
    threshold_rationale: "Over 2% of edge requests erroring for 5 minutes: origin or VCL trouble."
    runbook_url: "https://docs.watchtower.example/runbooks/fastly-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["syslog://fastly"], "pipeline": {"version": 1, "stages": [{"type": "parse_json", "target": "body", "when": "starts_with(body, \"{\")"}, {"type": "parse_kv", "target": "body", "when": "contains(body, \"level=\")"}, {"type": "remap", "rename": {"msg": "message"}}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
