name: gitlab_runner
version: "1.0.0"
discovery:
  process_names: ["gitlab-runner"]
  ports: [9252]
  k8s_labels: {"app": "gitlab-runner"}
module:
  kind: gitlab_runner
  config_defaults: {"url": "http://127.0.0.1:9252", "interval": "30s"}
metrics:
  - {name: "gitlab_runner_jobs", unit: "{jobs}", description: "Jobs running by runner and state."}
  - {name: "gitlab_runner_concurrent", unit: "{jobs}", description: "Configured concurrent limit."}
  - {name: "gitlab_runner_limit", unit: "{jobs}", description: "Per-runner job limit."}
  - {name: "gitlab_runner_request_concurrency", unit: "{requests}", description: "Free job requests the runner may still make."}
  - {name: "gitlab_runner_errors_total", unit: "{errors}", description: "Runner errors by level (cumulative)."}
  - {name: "gitlab_runner_failed_jobs_total", unit: "{jobs}", description: "Failed jobs by failure reason (cumulative)."}
  - {name: "gitlab_runner_jobs_total", unit: "{jobs}", description: "Jobs started (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Jobs running by runner and state", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"gitlab_runner_jobs\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Configured concurrent limit", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"gitlab_runner_concurrent\"})"}, "options": {"unit": "short"}}, {"id": "p2", "title": "Per-runner job limit", "type": "timeseries", "grid": {"x": 0, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"gitlab_runner_limit\"})"}, "options": {"unit": "short"}}, {"id": "p3", "title": "Free job requests the runner may still make", "type": "timeseries", "grid": {"x": 12, "y": 8, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"gitlab_runner_request_concurrency\"})"}, "options": {"unit": "short"}}, {"id": "p4", "title": "Runner errors by level", "type": "timeseries", "grid": {"x": 0, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"gitlab_runner_errors_total\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p5", "title": "Failed jobs by failure reason", "type": "timeseries", "grid": {"x": 12, "y": 16, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name) (rate({__name__=\"gitlab_runner_failed_jobs_total\"}[5m]))"}, "options": {"unit": "short"}}]}
alerts:
  - name: "gitlab_runner unreachable"
    rule: {"name": "gitlab_runner unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"gitlab_runner\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "gitlab_runner unreachable", "runbook_url": ""}}
    threshold_rationale: "The gitlab_runner collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
  - name: "gitlab runner saturated"
    rule: {"name": "gitlab runner saturated", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"gitlab_runner_jobs\"}) / max by (host_name) ({__name__=\"gitlab_runner_concurrent\"})"}, "condition": {"threshold": {"op": "gt", "value": 0.9}}, "every_s": 60, "window_s": 300, "for_s": 900, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "gitlab runner saturated", "runbook_url": "https://docs.watchtower.example/runbooks/gitlab_runner-alert"}}
    threshold_rationale: "Running at the concurrency ceiling for 15 minutes: pipelines queue."
    runbook_url: "https://docs.watchtower.example/runbooks/gitlab_runner-alert"
    default_enabled: true
  - name: "gitlab runner system failures"
    rule: {"name": "gitlab runner system failures", "kind": "metric", "query": {"promql": "sum by (host_name) (increase({__name__=\"gitlab_runner_failed_jobs_total\", failure_reason=~\"runner_system_failure|scheduler_failure\"}[5m]))"}, "condition": {"threshold": {"op": "gt", "value": 0}}, "every_s": 60, "window_s": 300, "for_s": 300, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "gitlab runner system failures", "runbook_url": "https://docs.watchtower.example/runbooks/gitlab_runner-alert"}}
    threshold_rationale: "Runner-side failures are infrastructure, not code: jobs fail through no fault of the commit."
    runbook_url: "https://docs.watchtower.example/runbooks/gitlab_runner-alert"
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/gitlab-runner/runner.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_kv", "target": "body", "when": "contains(body, \"job=\")"}]}}
