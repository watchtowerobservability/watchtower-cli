name: vault
version: "1.0.0"
discovery:
  process_names: ["vault"]
  ports: [8200]
  k8s_labels: {"app.kubernetes.io/name": "vault"}
module:
  kind: vault
  config_defaults: {"url": "http://127.0.0.1:8200", "token": "CHANGE_ME", "interval": "30s"}
metrics:
  - {name: "vault_core_unsealed", unit: "1", description: "1 while this node is unsealed."}
  - {name: "vault_core_active", unit: "1", description: "1 on the active node."}
  - {name: "vault_token_count", unit: "{tokens}", description: "Tokens in the store."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "vault_core_unsealed", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"vault_core_unsealed\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "vault unreachable"
    rule: {"name": "vault unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"vault\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "vault unreachable", "runbook_url": ""}}
    threshold_rationale: "The vault collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/var/log/vault/vault.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "%{DATA:time} \\[%{WORD:level}\\] +%{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
