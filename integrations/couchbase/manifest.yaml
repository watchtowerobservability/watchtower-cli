name: couchbase
version: "1.0.0"
discovery:
  process_names: ["couchbase-server"]
  ports: [8091]
  k8s_labels: {"app.kubernetes.io/name": "couchbase"}
module:
  kind: couchbase
  config_defaults: {"url": "http://127.0.0.1:8091", "username": "watchtower", "password": "CHANGE_ME", "interval": "30s"}
metrics:
  - {name: "couchbase_kv_ops", unit: "{operations}", description: "Data service operations by bucket and op (cumulative)."}
  - {name: "couchbase_kv_curr_items", unit: "{items}", description: "Items in the active vBuckets of a bucket."}
  - {name: "couchbase_kv_mem_used_bytes", unit: "By", description: "Memory the data service uses for a bucket."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "KV ops/s", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "sum by (host_name, bucket) (rate({__name__=\"couchbase_kv_ops\"}[5m]))"}, "options": {"unit": "short"}}, {"id": "p1", "title": "KV memory", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name, bucket) ({__name__=\"couchbase_kv_mem_used_bytes\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "couchbase unreachable"
    rule: {"name": "couchbase unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"couchbase\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "couchbase unreachable", "runbook_url": ""}}
    threshold_rationale: "The couchbase collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
logs: {"paths": ["/opt/couchbase/var/lib/couchbase/logs/info.log"], "pipeline": {"version": 1, "stages": [{"type": "parse_grok", "target": "body", "pattern": "\\[%{DATA:component}:%{WORD:level},%{DATA:time},%{DATA:node}:%{DATA:module}:%{DATA:origin}\\]%{GREEDYDATA:message}", "on_fail": "keep"}, {"type": "remap", "set_severity": {"from": "level", "map": {"trace": "TRACE", "debug": "DEBUG", "dbg": "DEBUG", "info": "INFO", "inf": "INFO", "notice": "INFO", "warn": "WARN", "wrn": "WARN", "warning": "WARN", "error": "ERROR", "err": "ERROR", "severe": "ERROR", "crit": "FATAL", "critical": "FATAL", "fatal": "FATAL", "ftl": "FATAL", "trc": "TRACE"}}}]}}
