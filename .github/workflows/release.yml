name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  # One runner per platform: six builds in a row on one runner took 8.5 of the release's 10 minutes.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: '0'
          TARGET: ${{ matrix.target }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          os=${TARGET%/*}; arch=${TARGET#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
          mkdir dist
          # `wtctl version` prints VERSION; `wtctl self-update` fetches wtctl_<os>_<arch>[.exe] + SHA256SUMS
          GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" -o "dist/wtctl_${os}_${arch}${ext}" ./wtctl
          echo "name=wtctl_${os}_${arch}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Refuse stage versions
        run: case "${GITHUB_REF_NAME#v}" in 0.0.0|0.0.0-*) echo "refusing to release $GITHUB_REF_NAME"; exit 1;; esac
      - uses: actions/checkout@v4
      - name: Tag, package.json and CHANGELOG agree
        run: |
          v=${GITHUB_REF_NAME#v}
          [ "$(node -p 'require("./npm/package.json").version')" = "$v" ] || { echo "npm/package.json version differs from tag $v"; exit 1; }
          top=$(grep -m1 -oE '^## \[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          [ "$top" = "$v" ] || { echo "top CHANGELOG.md entry ($top) differs from tag $v"; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./wtctl/...
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wtctl_*
          merge-multiple: true
      - name: Checksums and version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          [ "$(ls dist | wc -l)" = 6 ] || { echo "expected 6 binaries, got: $(ls dist)"; exit 1; }
          chmod +x dist/wtctl_linux_amd64
          (cd dist && sha256sum * > SHA256SUMS)
          [ "$(./dist/wtctl_linux_amd64 version | cut -d' ' -f2)" = "$VERSION" ]
      - name: Scoop manifest
        # attached to the release with the real hashes: `scoop install <release>/wtctl.json`
        run: |
          v=${GITHUB_REF_NAME#v}
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          sum() { grep " wtctl_$1\$" dist/SHA256SUMS | cut -d' ' -f1; }
          jq -n --arg v "$v" --arg base "$base" --arg a64 "$(sum windows_amd64.exe)" --arg arm "$(sum windows_arm64.exe)" \
            --arg home "https://github.com/${GITHUB_REPOSITORY}" '{
              version: $v, description: "Watchtower command line client", homepage: $home, license: "Apache-2.0",
              architecture: {
                "64bit": {url: ($base + "/wtctl_windows_amd64.exe#/wtctl.exe"), hash: $a64},
                "arm64": {url: ($base + "/wtctl_windows_arm64.exe#/wtctl.exe"), hash: $arm}
              },
              bin: "wtctl.exe",
              checkver: {github: $home},
              autoupdate: {architecture: {
                "64bit": {url: ($home + "/releases/download/v$version/wtctl_windows_amd64.exe#/wtctl.exe")},
                "arm64": {url: ($home + "/releases/download/v$version/wtctl_windows_arm64.exe#/wtctl.exe")}
              }}
            }' > dist/wtctl.json
          [ -n "$(jq -r '.architecture."64bit".hash' dist/wtctl.json)" ]
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # a re-pushed tag (e.g. to retry the npm job) keeps the release it already has
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "TAP_TOKEN absent, skipping tap"; exit 0; fi
          v=${GITHUB_REF_NAME#v}
          sum() { grep " wtctl_$1\$" dist/SHA256SUMS | cut -d' ' -f1; }
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/watchtowerobservability/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/wtctl.rb <<EOF
          class Wtctl < Formula
            desc "Watchtower command line client"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${v}"
            license "Apache-2.0"
            on_macos do
              on_arm do
                url "${base}/wtctl_darwin_arm64"
                sha256 "$(sum darwin_arm64)"
              end
              on_intel do
                url "${base}/wtctl_darwin_amd64"
                sha256 "$(sum darwin_amd64)"
              end
            end
            on_linux do
              on_arm do
                url "${base}/wtctl_linux_arm64"
                sha256 "$(sum linux_arm64)"
              end
              on_intel do
                url "${base}/wtctl_linux_amd64"
                sha256 "$(sum linux_amd64)"
              end
            end
            def install
              bin.install Dir["wtctl_*"].first => "wtctl"
            end
            test do
              system "#{bin}/wtctl", "--help"
            end
          end
          EOF
          cd tap
          git config user.name "watchtower release"
          git config user.email "release@users.noreply.github.com"
          git add Formula/wtctl.rb
          git commit -m "wtctl ${v}"
          git push
  npm:
    needs: release
    runs-on: ubuntu-latest
    # id-token: npm trusted publishing (OIDC) + provenance; NPM_TOKEN stays an optional fallback
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse stage versions
        run: case "${GITHUB_REF_NAME#v}" in 0.0.0|0.0.0-*) echo "refusing to release $GITHUB_REF_NAME"; exit 1;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@^11.5.1 --no-audit --no-fund >/dev/null
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        working-directory: npm
      - name: Pin the release's binary checksums inside the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          node npm/scripts/pin-checksums.mjs "$RUNNER_TEMP/SHA256SUMS"
      - run: node --test npm/test.js
      - name: Pack, install the tarball into a clean project (real postinstall download), run wtctl
        run: |
          tmp="$(mktemp -d)"
          (cd npm && npm pack --pack-destination "$tmp" --ignore-scripts)
          mkdir "$tmp/app" && cd "$tmp/app" && npm init -y >/dev/null
          npm install --no-audit --no-fund "$tmp"/*.tgz
          [ "$(npx --no-install wtctl version | cut -d' ' -f2)" = "${GITHUB_REF_NAME#v}" ]
      - name: npm publish (provenance)
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          id="$(node -p 'const p=require("./package.json"); p.name+"@"+p.version')"
          if npm view "$id" version >/dev/null 2>&1; then echo "$id already on npm"; exit 0; fi
          [ -n "$NODE_AUTH_TOKEN" ] || unset NODE_AUTH_TOKEN
          npm publish --provenance --access public
