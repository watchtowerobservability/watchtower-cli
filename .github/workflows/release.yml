name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./wtctl/...
      - name: Cross-build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/wtctl_${os}_${arch}${ext}" ./wtctl
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "TAP_TOKEN absent, skipping tap"; exit 0; fi
          v=${GITHUB_REF_NAME#v}
          sum() { grep " wtctl_$1\$" dist/SHA256SUMS | cut -d' ' -f1; }
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/watchtowerobservability/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/wtctl.rb <<EOF
          class Wtctl < Formula
            desc "Watchtower command line client"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${v}"
            license "Apache-2.0"
            on_macos do
              on_arm do
                url "${base}/wtctl_darwin_arm64"
                sha256 "$(sum darwin_arm64)"
              end
              on_intel do
                url "${base}/wtctl_darwin_amd64"
                sha256 "$(sum darwin_amd64)"
              end
            end
            on_linux do
              on_arm do
                url "${base}/wtctl_linux_arm64"
                sha256 "$(sum linux_arm64)"
              end
              on_intel do
                url "${base}/wtctl_linux_amd64"
                sha256 "$(sum linux_amd64)"
              end
            end
            def install
              bin.install Dir["wtctl_*"].first => "wtctl"
            end
            test do
              system "#{bin}/wtctl", "--help"
            end
          end
          EOF
          cd tap
          git config user.name "watchtower release"
          git config user.email "release@users.noreply.github.com"
          git add Formula/wtctl.rb
          git commit -m "wtctl ${v}"
          git push
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@watchtowerobservability'
      - run: node --test npm/test.js
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
        working-directory: npm
      - run: npm publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
