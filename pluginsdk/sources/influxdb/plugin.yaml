# Signed bundle (X08): put your server's host in egress_hosts, then from go/:
#   mkdir -p /tmp/influxdb && cp pluginsdk/sources/influxdb/plugin.yaml /tmp/influxdb/
#   GOOS=linux go build -o /tmp/influxdb/plugin ./pluginsdk/sources/influxdb
#   wtctl plugin pack --dir /tmp/influxdb --key publisher.seed --out influxdb.tar.gz
#   wtctl plugin push --file influxdb.tar.gz --api <url> --key <key> --org <org_...>
# A credential goes in secret_refs and secret_headers; the plugin never sees its value.
name: influxdb
version: 1.0.0
kinds: [source]
permissions:
  egress_hosts: []
  secret_refs: []
  secret_headers: []
